<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <title>Simple P2P Chat</title>


  <style>

    /* =========================
       RESET
       ========================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background: #111827;
      color: white;
    }


    /* =========================
       MAIN CHAT CONTAINER
       ========================= */

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }


    .chat {
      width: 100%;
      max-width: 600px;

      height: 90vh;

      background: #1f2937;

      border-radius: 12px;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }


    /* =========================
       HEADER
       ========================= */

    header {
      flex-shrink: 0;

      min-height: 64px;

      padding: 14px 18px;

      background: #2563eb;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }


    #chatName {
      display: inline-block;

      max-width: 380px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      vertical-align: middle;
    }


    .chat-title {
      min-width: 0;

      font-size: 20px;
      font-weight: bold;

      overflow: hidden;
    }


    #userCount {
      flex-shrink: 0;

      font-size: 13px;
      font-weight: normal;

      opacity: 0.9;

      white-space: nowrap;
    }


    /* =========================
       MESSAGES
       ========================= */

    #messages {
      flex: 1;

      min-height: 0;

      padding: 20px;

      overflow-y: auto;
      overflow-x: hidden;

      -webkit-overflow-scrolling: touch;

      scroll-behavior: smooth;
    }


    .message {
      margin-bottom: 12px;

      padding: 10px 14px;

      background: #374151;

      border-radius: 8px;

      overflow-wrap: anywhere;

      word-break: break-word;
    }


    .name {
      margin-bottom: 4px;

      font-size: 12px;

      color: #93c5fd;

      font-weight: bold;
    }


    .system-message {
      margin: 10px 0;

      color: #9ca3af;

      font-size: 13px;

      text-align: center;

      overflow-wrap: anywhere;
    }


    /* =========================
       MESSAGE INPUT
       ========================= */

    .input-area {
      flex-shrink: 0;

      display: flex;

      gap: 8px;

      padding: 12px;

      background: #111827;

      /* Safe area for phones with
         a bottom home indicator */
      padding-bottom:
        max(12px, env(safe-area-inset-bottom));
    }


    #messageInput {
      min-width: 0;

      flex: 1;

      padding: 12px;

      border: none;

      border-radius: 8px;

      outline: none;

      font-size: 16px;

      background: white;

      color: #111827;
    }


    #messageInput::placeholder {
      color: #6b7280;
    }


    button {
      flex-shrink: 0;

      min-height: 46px;

      padding: 12px 18px;

      border: none;

      border-radius: 8px;

      background: #2563eb;

      color: white;

      cursor: pointer;

      font-size: 15px;

      -webkit-tap-highlight-color: transparent;
    }


    button:hover {
      background: #1d4ed8;
    }


    button:active {
      transform: scale(0.98);
    }


    button:disabled {
      background: #4b5563;

      cursor: not-allowed;

      transform: none;
    }


    /* =========================
       LOGIN SCREEN
       ========================= */

    #login {
      position: fixed;

      z-index: 10;

      width: calc(100% - 32px);

      max-width: 360px;

      padding: 28px;

      background: #1f2937;

      border-radius: 12px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.4);
    }


    #login h2 {
      margin: 0 0 20px;

      font-size: 24px;

      text-align: center;
    }


    #login input {
      width: 100%;

      height: 48px;

      margin-bottom: 10px;

      padding: 12px;

      border: none;

      border-radius: 8px;

      outline: none;

      font-size: 16px;
    }


    #login button {
      width: 100%;

      margin-top: 4px;

      min-height: 48px;

      font-size: 16px;
    }


    #connectionStatus {
      min-height: 18px;

      margin-top: 10px;

      color: #d1d5db;

      font-size: 12px;

      line-height: 18px;

      text-align: center;
    }


    /* =========================
       TABLETS / SMALL LAPTOPS
       ========================= */

    @media (max-width: 700px) {

      body {
        align-items: stretch;
      }


      .chat {
        width: 100%;
        max-width: none;

        height: 100dvh;
        min-height: 100dvh;

        border-radius: 0;
      }

    }


    /* =========================
       PHONES
       ========================= */

    @media (max-width: 480px) {

      header {
        min-height: 58px;

        padding: 12px 14px;
      }


      .chat-title {
        font-size: 17px;
      }


      #chatName {
        max-width: 190px;
      }


      #userCount {
        font-size: 12px;
      }


      #messages {
        padding: 14px;
      }


      .message {
        padding: 10px 12px;

        margin-bottom: 10px;

        font-size: 15px;

        border-radius: 8px;
      }


      .name {
        font-size: 11px;
      }


      .input-area {
        gap: 6px;

        padding: 8px;

        padding-bottom:
          max(8px, env(safe-area-inset-bottom));
      }


      #messageInput {
        min-height: 46px;

        padding: 11px;

        font-size: 16px;
      }


      .input-area button {
        min-width: 68px;

        padding: 11px 12px;

        font-size: 14px;
      }


      #login {
        width: calc(100% - 28px);

        padding: 24px 20px;
      }


      #login h2 {
        font-size: 22px;

        margin-bottom: 18px;
      }

    }


    /* =========================
       VERY SMALL PHONES
       ========================= */

    @media (max-width: 360px) {

      .chat-title {
        font-size: 16px;
      }


      #chatName {
        max-width: 150px;
      }


      #userCount {
        font-size: 11px;
      }


      #messages {
        padding: 10px;
      }


      .message {
        font-size: 14px;
      }


      .input-area button {
        min-width: 60px;

        padding-left: 8px;
        padding-right: 8px;
      }

    }


    /* =========================
       LANDSCAPE PHONES
       ========================= */

    @media (
      max-height: 500px
    ) and (
      orientation: landscape
    ) {

      .chat {
        height: 100dvh;
        min-height: 100dvh;
      }


      header {
        min-height: 48px;

        padding: 8px 14px;
      }


      #messages {
        padding: 10px 14px;
      }


      .input-area {
        padding: 6px;

        padding-bottom:
          max(6px, env(safe-area-inset-bottom));
      }


      #messageInput,
      .input-area button {
        min-height: 40px;
      }


      #login {
        max-height: calc(100dvh - 20px);

        overflow-y: auto;

        padding: 18px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       LOGIN / JOIN SCREEN
       ========================= -->

  <div id="login">

    <h2>Join Chat</h2>


    <input
      id="username"
      type="text"
      placeholder="Your name"
      maxlength="30"
      autocomplete="name"
      autocapitalize="words"
    >


    <input
      id="chatNameInput"
      type="text"
      placeholder="Chat name"
      maxlength="50"
      autocomplete="off"
      autocapitalize="words"
    >


    <button onclick="joinChat()">
      Join Chat
    </button>


    <div id="connectionStatus"></div>

  </div>



  <!-- =========================
       CHAT
       ========================= -->

  <div class="chat">


    <header>

      <div class="chat-title">
        💬 <span id="chatName">Chat</span>
      </div>


      <div id="userCount">
        0 / 5 users
      </div>

    </header>



    <!-- =========================
         MESSAGES
         ========================= -->

    <div id="messages"></div>



    <!-- =========================
         MESSAGE INPUT
         ========================= -->

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        maxlength="1000"
        autocomplete="off"
        enterkeyhint="send"
        onkeydown="handleKey(event)"
      >


      <button
        id="sendButton"
        onclick="sendMessage()"
        disabled
      >
        Send
      </button>

    </div>

  </div>



  <script>

    let username = "";

    let socket = null;


    // =========================
    // JOIN CHAT
    // =========================

    function joinChat() {

      username =
        document
          .getElementById("username")
          .value
          .trim();


      const chatName =
        document
          .getElementById("chatNameInput")
          .value
          .trim();


      const status =
        document.getElementById(
          "connectionStatus"
        );


      if (!username) {

        status.textContent =
          "Please enter your name.";

        document
          .getElementById("username")
          .focus();

        return;
      }


      if (!chatName) {

        status.textContent =
          "Please enter a chat name.";

        document
          .getElementById("chatNameInput")
          .focus();

        return;
      }


      status.textContent =
        "Connecting...";


      document
        .getElementById("username")
        .disabled = true;


      document
        .getElementById("chatNameInput")
        .disabled = true;


      socket = new WebSocket(
        "wss://basicchats.onrender.com"
      );


      // =========================
      // CONNECTION OPEN
      // =========================

      socket.onopen = () => {

        socket.send(
          JSON.stringify({

            type: "join",

            username: username,

            chatName: chatName

          })
        );

      };


      // =========================
      // SERVER MESSAGE
      // =========================

      socket.onmessage = (event) => {

        let data;


        try {

          data =
            JSON.parse(event.data);

        } catch (error) {

          console.error(
            "Invalid server message:",
            event.data
          );

          return;
        }


        // =========================
        // JOIN ERROR
        // =========================

        if (data.type === "joinError") {

          status.textContent =
            data.message;


          document
            .getElementById("username")
            .disabled = false;


          document
            .getElementById("chatNameInput")
            .disabled = false;


          return;
        }


        // =========================
        // SUCCESSFULLY JOINED
        // =========================

        if (data.type === "joined") {

          document
            .getElementById("login")
            .style.display = "none";


          document
            .getElementById("sendButton")
            .disabled = false;


          document
            .getElementById("chatName")
            .textContent =
              data.chatName;


          updateUserCount(
            data.userCount,
            data.maxUsers
          );


          addSystemMessage(
            `You joined "${data.chatName}".`
          );


          document
            .getElementById("messageInput")
            .focus();


          return;
        }


        // =========================
        // USER COUNT
        // =========================

        if (data.type === "userCount") {

          updateUserCount(
            data.userCount,
            data.maxUsers
          );

          return;
        }


        // =========================
        // SYSTEM MESSAGE
        // =========================

        if (data.type === "system") {

          addSystemMessage(
            data.message
          );

          return;
        }


        // =========================
        // CHAT MESSAGE
        // =========================

        if (data.type === "message") {

          addMessage(
            data.username,
            data.text
          );

          return;
        }

      };


      // =========================
      // CONNECTION ERROR
      // =========================

      socket.onerror = () => {

        status.textContent =
          "Unable to connect to the chat server.";

        document
          .getElementById("username")
          .disabled = false;


        document
          .getElementById("chatNameInput")
          .disabled = false;

      };


      // =========================
      // DISCONNECTED
      // =========================

      socket.onclose = () => {

        document
          .getElementById("sendButton")
          .disabled = true;


        if (
          document
            .getElementById("login")
            .style.display === "none"
        ) {

          addSystemMessage(
            "Disconnected from server."
          );

        }

      };

    }


    // =========================
    // SEND MESSAGE
    // =========================

    function sendMessage() {

      const input =
        document.getElementById(
          "messageInput"
        );


      const text =
        input.value.trim();


      if (
        !text ||
        !socket ||
        socket.readyState !==
          WebSocket.OPEN
      ) {

        return;
      }


      socket.send(
        JSON.stringify({

          type: "message",

          text: text

        })
      );


      // Display your own message immediately.

      addMessage(
        "You",
        text
      );


      input.value = "";

      input.focus();

    }


    // =========================
    // ENTER TO SEND
    // =========================

    function handleKey(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

      }

    }


    // =========================
    // USER COUNT
    // =========================

    function updateUserCount(
      count,
      max
    ) {

      document
        .getElementById("userCount")
        .textContent =
          `${count} / ${max} users`;

    }


    // =========================
    // DISPLAY CHAT MESSAGE
    // =========================

    function addMessage(
      name,
      text
    ) {

      const messages =
        document.getElementById(
          "messages"
        );


      const div =
        document.createElement("div");

      div.className =
        "message";


      const nameElement =
        document.createElement("div");

      nameElement.className =
        "name";

      nameElement.textContent =
        name;


      const textElement =
        document.createElement("div");

      textElement.textContent =
        text;


      div.appendChild(
        nameElement
      );

      div.appendChild(
        textElement
      );


      messages.appendChild(div);


      messages.scrollTop =
        messages.scrollHeight;

    }


    // =========================
    // SYSTEM MESSAGE
    // =========================

    function addSystemMessage(
      text
    ) {

      const messages =
        document.getElementById(
          "messages"
        );


      const div =
        document.createElement("div");

      div.className =
        "system-message";

      div.textContent =
        text;


      messages.appendChild(div);


      messages.scrollTop =
        messages.scrollHeight;

    }

  </script>

</body>

</html>

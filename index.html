<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Simple P2P Chat</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    .chat {
      width: 100%;
      max-width: 600px;
      height: 90vh;

      background: #1f2937;

      border-radius: 12px;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }


    header {
      padding: 18px;

      background: #2563eb;

      font-size: 20px;
      font-weight: bold;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    #userCount {
      font-size: 13px;
      font-weight: normal;
      opacity: 0.9;
    }


    #messages {
      flex: 1;

      padding: 20px;

      overflow-y: auto;
    }


    .message {
      margin-bottom: 12px;

      padding: 10px 14px;

      background: #374151;

      border-radius: 8px;
    }


    .name {
      font-size: 12px;

      color: #93c5fd;

      margin-bottom: 4px;
    }


    .system-message {
      color: #9ca3af;

      font-size: 13px;

      text-align: center;

      margin: 10px 0;
    }


    .input-area {
      display: flex;

      padding: 12px;

      gap: 8px;

      background: #111827;
    }


    input {
      flex: 1;

      padding: 12px;

      border: none;

      border-radius: 8px;

      outline: none;

      font-size: 15px;
    }


    button {
      padding: 12px 18px;

      border: none;

      border-radius: 8px;

      background: #2563eb;

      color: white;

      cursor: pointer;

      font-size: 15px;
    }


    button:hover {
      background: #1d4ed8;
    }


    button:disabled {
      background: #4b5563;

      cursor: not-allowed;
    }


    #login {
      position: absolute;

      z-index: 10;

      background: #1f2937;

      padding: 30px;

      border-radius: 12px;

      width: 300px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }


    #login h2 {
      margin-top: 0;

      margin-bottom: 20px;
    }


    #login input {
      width: 100%;

      margin-bottom: 10px;
    }


    #login button {
      width: 100%;
    }


    #connectionStatus {
      font-size: 12px;

      color: #d1d5db;

      margin-top: 10px;

      text-align: center;
    }


    @media (max-width: 600px) {

      body {
        align-items: stretch;
      }


      .chat {
        height: 100vh;

        max-width: none;

        border-radius: 0;
      }


      header {
        padding: 15px;
      }


      #messages {
        padding: 15px;
      }


      .input-area {
        padding: 10px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       LOGIN / JOIN SCREEN
       ========================= -->

  <div id="login">

    <h2>Join Chat</h2>


    <input
      id="username"
      type="text"
      placeholder="Your name"
      maxlength="30"
      autocomplete="off"
    />


    <input
      id="chatNameInput"
      type="text"
      placeholder="Chat name"
      maxlength="50"
      autocomplete="off"
    />


    <button onclick="joinChat()">
      Join Chat
    </button>


    <div id="connectionStatus"></div>

  </div>



  <!-- =========================
       CHAT
       ========================= -->

  <div class="chat">


    <header>

      <div>
        💬 <span id="chatName">Chat</span>
      </div>


      <div id="userCount">
        0 / 5 users
      </div>

    </header>



    <!-- MESSAGES -->

    <div id="messages"></div>



    <!-- MESSAGE INPUT -->

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        maxlength="1000"
        autocomplete="off"
        onkeydown="handleKey(event)"
      />


      <button
        id="sendButton"
        onclick="sendMessage()"
        disabled
      >
        Send
      </button>

    </div>

  </div>



  <script>

    let username = "";

    let socket = null;


    // =========================
    // JOIN CHAT
    // =========================

    function joinChat() {

      username =
        document
          .getElementById("username")
          .value
          .trim();


      const chatName =
        document
          .getElementById("chatNameInput")
          .value
          .trim();


      const status =
        document.getElementById(
          "connectionStatus"
        );


      // Require username

      if (!username) {

        status.textContent =
          "Please enter your name.";

        return;
      }


      // Require chat name

      if (!chatName) {

        status.textContent =
          "Please enter a chat name.";

        return;
      }


      status.textContent =
        "Connecting...";


      // Connect to WebSocket server

      socket = new WebSocket(
        "wss://basicchats.onrender.com"
      );


      // =========================
      // CONNECTED
      // =========================

      socket.onopen = () => {

        // Send the username and chat name
        // to the server.

        socket.send(
          JSON.stringify({

            type: "join",

            username: username,

            chatName: chatName

          })
        );

      };


      // =========================
      // SERVER MESSAGE
      // =========================

      socket.onmessage = (event) => {

        let data;


        try {

          data =
            JSON.parse(event.data);

        } catch (error) {

          console.error(
            "Invalid server message:",
            event.data
          );

          return;
        }


        // =========================
        // JOIN ERROR
        // =========================

        if (data.type === "joinError") {

          status.textContent =
            data.message;

          return;
        }


        // =========================
        // SUCCESSFULLY JOINED
        // =========================

        if (data.type === "joined") {

          document
            .getElementById("login")
            .style.display = "none";


          document
            .getElementById("sendButton")
            .disabled = false;


          document
            .getElementById("chatName")
            .textContent =
              data.chatName;


          updateUserCount(
            data.userCount,
            data.maxUsers
          );


          addSystemMessage(
            `You joined "${data.chatName}".`
          );


          document
            .getElementById("messageInput")
            .focus();


          return;
        }


        // =========================
        // USER COUNT
        // =========================

        if (data.type === "userCount") {

          updateUserCount(
            data.userCount,
            data.maxUsers
          );

          return;
        }


        // =========================
        // SYSTEM MESSAGE
        // =========================

        if (data.type === "system") {

          addSystemMessage(
            data.message
          );

          return;
        }


        // =========================
        // CHAT MESSAGE
        // =========================

        if (data.type === "message") {

          addMessage(
            data.username,
            data.text
          );

          return;
        }

      };


      // =========================
      // ERROR
      // =========================

      socket.onerror = () => {

        status.textContent =
          "Unable to connect to the chat server.";

      };


      // =========================
      // DISCONNECTED
      // =========================

      socket.onclose = () => {

        document
          .getElementById("sendButton")
          .disabled = true;


        // Only display this after
        // successfully joining.

        if (
          document
            .getElementById("login")
            .style.display === "none"
        ) {

          addSystemMessage(
            "Disconnected from server."
          );

        }

      };

    }


    // =========================
    // SEND MESSAGE
    // =========================

    function sendMessage() {

      const input =
        document.getElementById(
          "messageInput"
        );


      const text =
        input.value.trim();


      if (
        !text ||
        !socket ||
        socket.readyState !==
          WebSocket.OPEN
      ) {

        return;
      }


      socket.send(
        JSON.stringify({

          type: "message",

          text: text

        })
      );


      // The server doesn't send the
      // message back to the sender,
      // so display it locally.

      addMessage(
        "You",
        text
      );


      input.value = "";

      input.focus();

    }


    // =========================
    // ENTER TO SEND
    // =========================

    function handleKey(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

      }

    }


    // =========================
    // USER COUNT
    // =========================

    function updateUserCount(
      count,
      max
    ) {

      document
        .getElementById("userCount")
        .textContent =
          `${count} / ${max} users`;

    }


    // =========================
    // DISPLAY CHAT MESSAGE
    // =========================

    function addMessage(
      name,
      text
    ) {

      const messages =
        document.getElementById(
          "messages"
        );


      const div =
        document.createElement("div");

      div.className =
        "message";


      const nameElement =
        document.createElement("div");

      nameElement.className =
        "name";

      nameElement.textContent =
        name;


      const textElement =
        document.createElement("div");

      textElement.textContent =
        text;


      div.appendChild(
        nameElement
      );

      div.appendChild(
        textElement
      );


      messages.appendChild(div);


      messages.scrollTop =
        messages.scrollHeight;

    }


    // =========================
    // SYSTEM MESSAGE
    // =========================

    function addSystemMessage(
      text
    ) {

      const messages =
        document.getElementById(
          "messages"
        );


      const div =
        document.createElement("div");

      div.className =
        "system-message";

      div.textContent =
        text;


      messages.appendChild(div);


      messages.scrollTop =
        messages.scrollHeight;

    }

  </script>

</body>

</html>

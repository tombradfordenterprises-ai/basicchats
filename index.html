
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Basic Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       LOGIN SCREEN
       ========================= */

    #loginScreen {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #loginBox {
      width: 100%;
      max-width: 420px;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    #loginBox h1 {
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
    }

    #loginBox p {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    #loginBox input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 10px;
      background: #2b2b2b;
      color: white;
      outline: none;
    }

    #loginBox input:focus {
      box-shadow: 0 0 0 2px #4caf50;
    }

    #joinButton {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #4caf50;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #joinButton:hover {
      background: #43a047;
    }

    #joinButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #loginError {
      color: #ff6b6b;
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
    }

    /* =========================
       CHAT SCREEN
       ========================= */

    #chatScreen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    #chatHeader {
      flex-shrink: 0;
      min-height: 65px;
      padding: 10px 15px;
      background: #1e1e1e;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #chatInfo {
      flex: 1;
      min-width: 0;
    }

    #chatName {
      font-size: 20px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #userCount {
      font-size: 13px;
      color: #aaa;
      margin-top: 3px;
    }

    #homeButton {
      flex-shrink: 0;
      padding: 9px 13px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    #homeButton:hover {
      background: #444;
    }

    /* =========================
       MESSAGES
       ========================= */

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overscroll-behavior: contain;
    }

    .message {
      max-width: 85%;
      padding: 10px 13px;
      border-radius: 12px;
      background: #252525;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .message .username {
      font-size: 12px;
      font-weight: bold;
      color: #81c784;
      margin-bottom: 4px;
    }

    .message .messageText {
      white-space: pre-wrap;
    }

    .systemMessage {
      text-align: center;
      color: #888;
      font-size: 13px;
      padding: 3px 10px;
    }

    .drawingMessage {
      max-width: 90%;
    }

    .drawingMessage .username {
      font-size: 12px;
      font-weight: bold;
      color: #81c784;
      margin-bottom: 6px;
    }

    .drawingMessage img {
      display: block;
      max-width: 100%;
      height: auto;
      background: white;
      border-radius: 8px;
      border: 1px solid #444;
    }

    /* =========================
       INPUT AREA
       ========================= */

    #inputArea {
      flex-shrink: 0;
      padding: 10px;
      background: #1e1e1e;
      border-top: 1px solid #333;
      display: flex;
      gap: 8px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2b2b2b;
      color: white;
      outline: none;
    }

    #messageInput:focus {
      box-shadow: 0 0 0 2px #4caf50;
    }

    #sendButton,
    #drawButton {
      border: none;
      border-radius: 10px;
      padding: 0 15px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    #sendButton {
      background: #4caf50;
    }

    #sendButton:hover {
      background: #43a047;
    }

    #drawButton {
      background: #555;
    }

    #drawButton:hover {
      background: #666;
    }

    /* =========================
       DRAWING OVERLAY
       ========================= */

    #drawingOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.85);
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    #drawingBox {
      width: 100%;
      max-width: 700px;
      max-height: 95vh;
      background: #1e1e1e;
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    }

    #drawingTitle {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    /* =========================
       COLOR PICKER
       ========================= */

    #colorSection {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #colorLabel {
      font-size: 13px;
      color: #aaa;
    }

    #colorPalette {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .colorButton {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 50%;
      border: 3px solid #555;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
    }

    .colorButton:hover {
      transform: scale(1.08);
    }

    .colorButton.selected {
      border-color: white;
      box-shadow: 0 0 0 2px #4caf50;
      transform: scale(1.08);
    }

    #customColor {
      width: 40px;
      height: 40px;
      padding: 2px;
      border: 3px solid #555;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }

    #customColor.selected {
      border-color: white;
      box-shadow: 0 0 0 2px #4caf50;
    }

    /* =========================
       CANVAS
       ========================= */

    #canvasContainer {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: white;
    }

    #drawingCanvas {
      display: block;
      width: 100%;
      height: min(55vh, 450px);
      background: white;
      touch-action: none;
      cursor: crosshair;
    }

    /* =========================
       DRAWING CONTROLS
       ========================= */

    #drawingControls {
      display: flex;
      gap: 8px;
    }

    #drawingControls button {
      flex: 1;
      min-height: 44px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    #clearDrawingButton {
      background: #555;
    }

    #cancelDrawingButton {
      background: #8b2f2f;
    }

    #sendDrawingButton {
      background: #4caf50;
    }

    #clearDrawingButton:hover {
      background: #666;
    }

    #cancelDrawingButton:hover {
      background: #a33a3a;
    }

    #sendDrawingButton:hover {
      background: #43a047;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {
      #loginBox {
        padding: 22px;
      }

      #chatHeader {
        min-height: 60px;
        padding: 8px 10px;
      }

      #chatName {
        font-size: 18px;
      }

      #homeButton {
        padding: 8px 10px;
        font-size: 13px;
      }

      #messages {
        padding: 10px;
      }

      #inputArea {
        gap: 6px;
        padding: 8px;
      }

      #messageInput {
        padding: 11px;
      }

      #sendButton,
      #drawButton {
        padding: 0 11px;
        font-size: 13px;
      }

      #drawingOverlay {
        padding: 8px;
      }

      #drawingBox {
        padding: 10px;
        border-radius: 12px;
      }

      #drawingCanvas {
        height: 50vh;
      }

      .colorButton {
        width: 32px;
        height: 32px;
      }

      #drawingControls button {
        min-height: 42px;
        font-size: 13px;
      }
    }

    @media (max-width: 400px) {
      #drawButton {
        font-size: 0;
      }

      #drawButton::after {
        content: "✏️";
        font-size: 18px;
      }

      #sendButton {
        font-size: 0;
      }

      #sendButton::after {
        content: "➤";
        font-size: 18px;
      }

      #homeButton {
        font-size: 0;
      }

      #homeButton::after {
        content: "⌂";
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN SCREEN
       ========================= -->

  <div id="loginScreen">

    <div id="loginBox">

      <h1>Basic Chat</h1>

      <p>
        Enter your name and the name of the chat you want to join.
      </p>

      <input
        id="usernameInput"
        type="text"
        placeholder="Your name"
        maxlength="30"
        autocomplete="off"
      >

      <input
        id="chatNameInput"
        type="text"
        placeholder="Chat name"
        maxlength="50"
        autocomplete="off"
      >

      <button
        id="joinButton"
        type="button"
        onclick="joinChat()"
      >
        Join Chat
      </button>

      <div id="loginError"></div>

    </div>

  </div>


  <!-- =========================
       CHAT SCREEN
       ========================= -->

  <div id="chatScreen">

    <div id="chatHeader">

      <div id="chatInfo">

        <div id="chatName">
          Chat
        </div>

        <div id="userCount">
          0 / 5 users
        </div>

      </div>

      <button
        id="homeButton"
        type="button"
        onclick="goHome()"
      >
        Home
      </button>

    </div>


    <div id="messages"></div>


    <div id="inputArea">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        maxlength="1000"
        autocomplete="off"
      >

      <button
        id="drawButton"
        type="button"
        onclick="openDrawing()"
      >
        Draw
      </button>

      <button
        id="sendButton"
        type="button"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  </div>


  <!-- =========================
       DRAWING POPUP
       ========================= -->

  <div id="drawingOverlay">

    <div id="drawingBox">

      <div id="drawingTitle">
        Draw Something
      </div>


      <div id="colorSection">

        <div id="colorLabel">
          Drawing color
        </div>

        <div id="colorPalette">

          <button
            class="colorButton selected"
            type="button"
            title="Black"
            aria-label="Black"
            data-color="#000000"
            style="background:#000000;"
            onclick="selectDrawingColor('#000000', this)"
          ></button>

          <button
            class="colorButton"
            type="button"
            title="Red"
            aria-label="Red"
            data-color="#ff0000"
            style="background:#ff0000;"
            onclick="selectDrawingColor('#ff0000', this)"
          ></button>

          <button
            class="colorButton"
            type="button"
            title="Blue"
            aria-label="Blue"
            data-color="#0066ff"
            style="background:#0066ff;"
            onclick="selectDrawingColor('#0066ff', this)"
          ></button>

          <button
            class="colorButton"
            type="button"
            title="Green"
            aria-label="Green"
            data-color="#00a000"
            style="background:#00a000;"
            onclick="selectDrawingColor('#00a000', this)"
          ></button>

          <button
            class="colorButton"
            type="button"
            title="Yellow"
            aria-label="Yellow"
            data-color="#ffd700"
            style="background:#ffd700;"
            onclick="selectDrawingColor('#ffd700', this)"
          ></button>

          <button
            class="colorButton"
            type="button"
            title="Purple"
            aria-label="Purple"
            data-color="#8000ff"
            style="background:#8000ff;"
            onclick="selectDrawingColor('#8000ff', this)"
          ></button>

          <button
            class="colorButton"
            type="button"
            title="Orange"
            aria-label="Orange"
            data-color="#ff8000"
            style="background:#ff8000;"
            onclick="selectDrawingColor('#ff8000', this)"
          ></button>

          <button
            class="colorButton"
            type="button"
            title="Pink"
            aria-label="Pink"
            data-color="#ff1493"
            style="background:#ff1493;"
            onclick="selectDrawingColor('#ff1493', this)"
          ></button>

          <button
            class="colorButton"
            type="button"
            title="Brown"
            aria-label="Brown"
            data-color="#8b4513"
            style="background:#8b4513;"
            onclick="selectDrawingColor('#8b4513', this)"
          ></button>

          <button
            class="colorButton"
            type="button"
            title="Cyan"
            aria-label="Cyan"
            data-color="#00bcd4"
            style="background:#00bcd4;"
            onclick="selectDrawingColor('#00bcd4', this)"
          ></button>

          <input
            id="customColor"
            type="color"
            value="#000000"
            title="Choose a custom color"
            aria-label="Choose a custom color"
            onchange="selectCustomColor(this)"
          >

        </div>

      </div>


      <div id="canvasContainer">

        <canvas id="drawingCanvas"></canvas>

      </div>


      <div id="drawingControls">

        <button
          id="clearDrawingButton"
          type="button"
          onclick="clearDrawing()"
        >
          Clear
        </button>

        <button
          id="cancelDrawingButton"
          type="button"
          onclick="closeDrawing()"
        >
          Cancel
        </button>

        <button
          id="sendDrawingButton"
          type="button"
          onclick="sendDrawing()"
        >
          Send Drawing
        </button>

      </div>

    </div>

  </div>


  <script>

    /* =========================
       WEBSOCKET
       ========================= */

    const SERVER_URL =
      "wss://basicchats.onrender.com";

    let socket = null;

    let currentUsername = "";
    let currentChatName = "";


    /* =========================
       DRAWING VARIABLES
       ========================= */

    let drawingCanvas = null;
    let drawingContext = null;
    let drawing = false;

    let drawingColor = "#000000";


    /* =========================
       ELEMENTS
       ========================= */

    const loginScreen =
      document.getElementById("loginScreen");

    const chatScreen =
      document.getElementById("chatScreen");

    const usernameInput =
      document.getElementById("usernameInput");

    const chatNameInput =
      document.getElementById("chatNameInput");

    const joinButton =
      document.getElementById("joinButton");

    const loginError =
      document.getElementById("loginError");

    const chatName =
      document.getElementById("chatName");

    const userCount =
      document.getElementById("userCount");

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const drawingOverlay =
      document.getElementById("drawingOverlay");

    const customColor =
      document.getElementById("customColor");


    /* =========================
       JOIN CHAT
       ========================= */

    function joinChat() {

      const username =
        usernameInput.value.trim();

      const chat =
        chatNameInput.value.trim();

      loginError.textContent = "";

      if (!username) {
        loginError.textContent =
          "Please enter your name.";
        return;
      }

      if (!chat) {
        loginError.textContent =
          "Please enter a chat name.";
        return;
      }

      joinButton.disabled = true;

      currentUsername = username;
      currentChatName = chat;

      socket = new WebSocket(SERVER_URL);

      socket.addEventListener("open", () => {

        socket.send(
          JSON.stringify({
            type: "join",
            username: username,
            chatName: chat
          })
        );

      });


      socket.addEventListener("message", (event) => {

        let data;

        try {
          data = JSON.parse(event.data);
        } catch (error) {
          console.error(
            "Invalid server response."
          );
          return;
        }


        /* =========================
           JOINED
           ========================= */

        if (data.type === "joined") {

          currentChatName =
            data.chatName;

          chatName.textContent =
            data.chatName;

          userCount.textContent =
            `${data.userCount} / ${data.maxUsers} users`;

          loginScreen.style.display =
            "none";

          chatScreen.style.display =
            "flex";

          messages.innerHTML = "";

          messageInput.focus();

          return;
        }


        /* =========================
           JOIN ERROR
           ========================= */

        if (data.type === "joinError") {

          loginError.textContent =
            data.message;

          joinButton.disabled = false;

          if (socket) {
            socket.close();
          }

          return;
        }


        /* =========================
           USER COUNT
           ========================= */

        if (data.type === "userCount") {

          userCount.textContent =
            `${data.userCount} / ${data.maxUsers} users`;

          return;
        }


        /* =========================
           SYSTEM MESSAGE
           ========================= */

        if (data.type === "system") {

          addSystemMessage(
            data.message
          );

          return;
        }


        /* =========================
           CHAT MESSAGE
           ========================= */

        if (data.type === "message") {

          addMessage(
            data.username,
            data.text
          );

          return;
        }


        /* =========================
           DRAWING
           ========================= */

        if (data.type === "drawing") {

          addDrawing(
            data.username,
            data.image
          );

          return;
        }


        /* =========================
           SERVER ERROR
           ========================= */

        if (data.type === "error") {

          console.error(
            "Server error:",
            data.message
          );

          alert(data.message);

          return;
        }

      });


      socket.addEventListener("close", () => {

        joinButton.disabled = false;

      });


      socket.addEventListener("error", () => {

        loginError.textContent =
          "Could not connect to the chat server.";

        joinButton.disabled = false;

      });

    }


    /* =========================
       SEND TEXT MESSAGE
       ========================= */

    function sendMessage() {

      if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      const text =
        messageInput.value.trim();

      if (!text) {
        return;
      }

      socket.send(
        JSON.stringify({
          type: "message",
          text: text
        })
      );

      messageInput.value = "";

      messageInput.focus();
    }


    /* =========================
       ADD MESSAGE
       ========================= */

    function addMessage(
      username,
      text
    ) {

      const message =
        document.createElement("div");

      message.className =
        "message";

      const name =
        document.createElement("div");

      name.className =
        "username";

      name.textContent =
        username;

      const messageText =
        document.createElement("div");

      messageText.className =
        "messageText";

      messageText.textContent =
        text;

      message.appendChild(name);
      message.appendChild(messageText);

      messages.appendChild(message);

      scrollMessagesToBottom();
    }


    /* =========================
       SYSTEM MESSAGE
       ========================= */

    function addSystemMessage(text) {

      const message =
        document.createElement("div");

      message.className =
        "systemMessage";

      message.textContent =
        text;

      messages.appendChild(message);

      scrollMessagesToBottom();
    }


    /* =========================
       ADD DRAWING
       ========================= */

    function addDrawing(
      username,
      image
    ) {

      const message =
        document.createElement("div");

      message.className =
        "drawingMessage";

      const name =
        document.createElement("div");

      name.className =
        "username";

      name.textContent =
        username;

      const imageElement =
        document.createElement("img");

      imageElement.src =
        image;

      imageElement.alt =
        `${username}'s drawing`;

      message.appendChild(name);
      message.appendChild(imageElement);

      messages.appendChild(message);

      imageElement.onload =
        scrollMessagesToBottom;

      scrollMessagesToBottom();
    }


    /* =========================
       SCROLL
       ========================= */

    function scrollMessagesToBottom() {

      messages.scrollTop =
        messages.scrollHeight;
    }


    /* =========================
       DRAWING SETUP
       ========================= */

    function setupDrawingCanvas() {

      drawingCanvas =
        document.getElementById(
          "drawingCanvas"
        );

      drawingContext =
        drawingCanvas.getContext("2d");

      resizeDrawingCanvas();

      drawingCanvas.addEventListener(
        "pointerdown",
        startDrawing
      );

      drawingCanvas.addEventListener(
        "pointermove",
        draw
      );

      drawingCanvas.addEventListener(
        "pointerup",
        stopDrawing
      );

      drawingCanvas.addEventListener(
        "pointercancel",
        stopDrawing
      );

      drawingCanvas.addEventListener(
        "pointerleave",
        stopDrawing
      );

    }


    /* =========================
       RESIZE CANVAS
       ========================= */

    function resizeDrawingCanvas() {

      if (!drawingCanvas) {
        return;
      }

      const rect =
        drawingCanvas.getBoundingClientRect();

      const ratio =
        window.devicePixelRatio || 1;

      drawingCanvas.width =
        rect.width * ratio;

      drawingCanvas.height =
        rect.height * ratio;

      drawingContext.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );

      drawingContext.fillStyle =
        "#ffffff";

      drawingContext.fillRect(
        0,
        0,
        rect.width,
        rect.height
      );

      setDrawingStyle();

    }


    /* =========================
       DRAWING STYLE
       ========================= */

    function setDrawingStyle() {

      if (!drawingContext) {
        return;
      }

      drawingContext.strokeStyle =
        drawingColor;

      drawingContext.fillStyle =
        drawingColor;

      drawingContext.lineWidth =
        3;

      drawingContext.lineCap =
        "round";

      drawingContext.lineJoin =
        "round";
    }


    /* =========================
       GET DRAWING POSITION
       ========================= */

    function getDrawingPosition(event) {

      const rect =
        drawingCanvas.getBoundingClientRect();

      return {
        x:
          event.clientX -
          rect.left,

        y:
          event.clientY -
          rect.top
      };

    }


    /* =========================
       START DRAWING
       ========================= */

    function startDrawing(event) {

      if (!drawingCanvas) {
        return;
      }

      drawing = true;

      drawingCanvas.setPointerCapture(
        event.pointerId
      );

      const position =
        getDrawingPosition(event);

      drawingContext.beginPath();

      drawingContext.moveTo(
        position.x,
        position.y
      );

      drawingContext.lineTo(
        position.x + 0.01,
        position.y + 0.01
      );

      drawingContext.stroke();
    }


    /* =========================
       DRAW
       ========================= */

    function draw(event) {

      if (!drawing) {
        return;
      }

      const position =
        getDrawingPosition(event);

      drawingContext.lineTo(
        position.x,
        position.y
      );

      drawingContext.stroke();
    }


    /* =========================
       STOP DRAWING
       ========================= */

    function stopDrawing(event) {

      if (!drawing) {
        return;
      }

      drawing = false;

      drawingContext.closePath();

      if (
        event &&
        drawingCanvas.hasPointerCapture(
          event.pointerId
        )
      ) {
        drawingCanvas.releasePointerCapture(
          event.pointerId
        );
      }
    }


    /* =========================
       SELECT COLOR
       ========================= */

    function selectDrawingColor(
      color,
      button
    ) {

      drawingColor = color;

      document
        .querySelectorAll(".colorButton")
        .forEach((element) => {
          element.classList.remove(
            "selected"
          );
        });

      customColor.classList.remove(
        "selected"
      );

      button.classList.add(
        "selected"
      );

      setDrawingStyle();
    }


    /* =========================
       CUSTOM COLOR
       ========================= */

    function selectCustomColor(
      input
    ) {

      drawingColor =
        input.value;

      document
        .querySelectorAll(".colorButton")
        .forEach((element) => {
          element.classList.remove(
            "selected"
          );
        });

      customColor.classList.add(
        "selected"
      );

      setDrawingStyle();
    }


    /* =========================
       OPEN DRAWING
       ========================= */

    function openDrawing() {

      drawingOverlay.style.display =
        "flex";

      if (!drawingCanvas) {
        setupDrawingCanvas();
      } else {
        resizeDrawingCanvas();
      }

    }


    /* =========================
       CLOSE DRAWING
       ========================= */

    function closeDrawing() {

      drawing = false;

      drawingOverlay.style.display =
        "none";
    }


    /* =========================
       CLEAR DRAWING
       ========================= */

    function clearDrawing() {

      if (!drawingCanvas) {
        return;
      }

      const rect =
        drawingCanvas.getBoundingClientRect();

      const ratio =
        window.devicePixelRatio || 1;

      drawingContext.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
      );

      drawingContext.fillStyle =
        "#ffffff";

      drawingContext.fillRect(
        0,
        0,
        rect.width,
        rect.height
      );

      setDrawingStyle();
    }


    /* =========================
       SEND DRAWING
       ========================= */

    function sendDrawing() {

      if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {
        return;
      }

      if (!drawingCanvas) {
        return;
      }

      const image =
        drawingCanvas.toDataURL(
          "image/png"
        );

      socket.send(
        JSON.stringify({
          type: "drawing",
          image: image
        })
      );

      closeDrawing();
    }


    /* =========================
       HOME BUTTON
       ========================= */

    function goHome() {

      if (socket) {

        try {
          socket.close();
        } catch (error) {
          console.error(error);
        }

        socket = null;
      }

      currentUsername = "";
      currentChatName = "";

      messages.innerHTML = "";

      chatScreen.style.display =
        "none";

      loginScreen.style.display =
        "flex";

      loginError.textContent = "";

      joinButton.disabled = false;

      usernameInput.value = "";
      chatNameInput.value = "";

      messageInput.value = "";

      closeDrawing();

      usernameInput.focus();
    }


    /* =========================
       ENTER KEY
       ========================= */

    usernameInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          chatNameInput.focus();
        }

      }
    );


    chatNameInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          joinChat();
        }

      }
    );


    messageInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );


    /* =========================
       WINDOW RESIZE
       ========================= */

    window.addEventListener(
      "resize",
      function() {

        if (
          drawingOverlay.style.display ===
          "flex"
        ) {
          resizeDrawingCanvas();
        }

      }
    );


    /* =========================
       INITIAL FOCUS
       ========================= */

    usernameInput.focus();

  </script>

</body>
</html>

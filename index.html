
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <title>Simple P2P Chat</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background: #111827;
      color: white;
    }


    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* =========================
       CHAT CONTAINER
       ========================= */

    .chat {
      width: 100%;
      max-width: 600px;

      height: 90vh;

      background: #1f2937;

      border-radius: 12px;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }


    /* =========================
       HEADER
       ========================= */

    header {
      flex-shrink: 0;

      min-height: 64px;

      padding: 12px 14px;

      background: #2563eb;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;
    }


    .header-left {
      min-width: 0;

      display: flex;

      align-items: center;

      gap: 8px;
    }


    .chat-title {
      min-width: 0;

      font-size: 20px;

      font-weight: bold;

      overflow: hidden;
    }


    #chatName {
      display: inline-block;

      max-width: 320px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      vertical-align: middle;
    }


    .header-right {
      flex-shrink: 0;

      display: flex;

      align-items: center;

      gap: 8px;
    }


    #userCount {
      font-size: 13px;

      font-weight: normal;

      opacity: 0.9;

      white-space: nowrap;
    }


    /* =========================
       HOME BUTTON
       ========================= */

    #homeButton {
      min-height: 38px;

      padding: 8px 12px;

      border: 1px solid rgba(255, 255, 255, 0.35);

      border-radius: 7px;

      background: rgba(255, 255, 255, 0.12);

      color: white;

      font-size: 13px;

      cursor: pointer;

      white-space: nowrap;
    }


    #homeButton:hover {
      background: rgba(255, 255, 255, 0.22);
    }


    #homeButton:active {
      transform: scale(0.97);
    }


    /* =========================
       MESSAGES
       ========================= */

    #messages {
      flex: 1;

      min-height: 0;

      padding: 20px;

      overflow-y: auto;

      overflow-x: hidden;

      -webkit-overflow-scrolling: touch;

      scroll-behavior: smooth;
    }


    .message {
      margin-bottom: 12px;

      padding: 10px 14px;

      background: #374151;

      border-radius: 8px;

      overflow-wrap: anywhere;

      word-break: break-word;
    }


    .name {
      margin-bottom: 4px;

      font-size: 12px;

      color: #93c5fd;

      font-weight: bold;
    }


    .system-message {
      margin: 10px 0;

      color: #9ca3af;

      font-size: 13px;

      text-align: center;

      overflow-wrap: anywhere;
    }


    /* =========================
       DRAWING MESSAGE
       ========================= */

    .drawing-message {
      margin-bottom: 12px;

      padding: 10px;

      background: #374151;

      border-radius: 8px;

      overflow: hidden;
    }


    .drawing-image {
      display: block;

      width: 100%;

      max-width: 400px;

      height: auto;

      background: white;

      border-radius: 6px;
    }


    /* =========================
       MESSAGE INPUT
       ========================= */

    .input-area {
      flex-shrink: 0;

      display: flex;

      gap: 8px;

      padding: 12px;

      background: #111827;

      padding-bottom:
        max(12px, env(safe-area-inset-bottom));
    }


    #messageInput {
      min-width: 0;

      flex: 1;

      padding: 12px;

      border: none;

      border-radius: 8px;

      outline: none;

      font-size: 16px;

      background: white;

      color: #111827;
    }


    #messageInput::placeholder {
      color: #6b7280;
    }


    button {
      flex-shrink: 0;

      min-height: 46px;

      padding: 12px 18px;

      border: none;

      border-radius: 8px;

      background: #2563eb;

      color: white;

      cursor: pointer;

      font-size: 15px;

      -webkit-tap-highlight-color: transparent;
    }


    button:hover {
      background: #1d4ed8;
    }


    button:active {
      transform: scale(0.98);
    }


    button:disabled {
      background: #4b5563;

      cursor: not-allowed;

      transform: none;
    }


    /* =========================
       DRAW BUTTON
       ========================= */

    #drawButton {
      background: #374151;
    }


    #drawButton:hover {
      background: #4b5563;
    }


    /* =========================
       LOGIN SCREEN
       ========================= */

    #login {
      position: fixed;

      z-index: 10;

      width: calc(100% - 28px);

      max-width: 360px;

      padding: 28px;

      background: #1f2937;

      border-radius: 12px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.4);
    }


    #login h2 {
      margin: 0 0 20px;

      font-size: 24px;

      text-align: center;
    }


    #login input {
      width: 100%;

      height: 48px;

      margin-bottom: 10px;

      padding: 12px;

      border: none;

      border-radius: 8px;

      outline: none;

      font-size: 16px;
    }


    #login button {
      width: 100%;

      margin-top: 4px;

      min-height: 48px;

      font-size: 16px;
    }


    #connectionStatus {
      min-height: 18px;

      margin-top: 10px;

      color: #d1d5db;

      font-size: 12px;

      line-height: 18px;

      text-align: center;
    }


    /* =========================
       DRAWING OVERLAY
       ========================= */

    #drawingOverlay {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 16px;

      background: rgba(0, 0, 0, 0.65);
    }


    /* =========================
       DRAWING BOX
       ========================= */

    #drawingBox {
      width: min(92vw, 500px);

      background: #1f2937;

      border-radius: 12px;

      padding: 12px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.5);

      display: flex;

      flex-direction: column;

      gap: 10px;
    }


    /* =========================
       DRAWING HEADER
       ========================= */

    #drawingHeader {
      display: flex;

      align-items: center;

      justify-content: space-between;

      font-size: 18px;

      font-weight: bold;
    }


    #closeDrawingButton {
      width: 40px;

      min-width: 40px;

      height: 40px;

      min-height: 40px;

      padding: 8px;

      background: #374151;

      font-size: 18px;
    }


    #closeDrawingButton:hover {
      background: #4b5563;
    }


    /* =========================
       DRAWING CANVAS
       ========================= */

    #drawingCanvas {
      display: block;

      width: 100%;

      height: 300px;

      background: white;

      border-radius: 8px;

      cursor: crosshair;

      touch-action: none;

      user-select: none;

      -webkit-user-select: none;
    }


    /* =========================
       DRAWING CONTROLS
       ========================= */

    #drawingControls {
      display: flex;

      gap: 8px;
    }


    #drawingControls button {
      flex: 1;

      min-height: 44px;

      padding: 10px;

      font-size: 13px;
    }


    #clearDrawingButton {
      background: #374151;
    }


    #clearDrawingButton:hover {
      background: #4b5563;
    }


    #cancelDrawingButton {
      background: #6b7280;
    }


    #cancelDrawingButton:hover {
      background: #4b5563;
    }


    #sendDrawingButton {
      background: #2563eb;
    }


    /* =========================
       TABLETS
       ========================= */

    @media (max-width: 700px) {

      body {
        align-items: stretch;
      }


      .chat {
        width: 100%;

        max-width: none;

        height: 100dvh;

        min-height: 100dvh;

        border-radius: 0;
      }

    }


    /* =========================
       PHONES
       ========================= */

    @media (max-width: 480px) {

      header {
        min-height: 58px;

        padding: 10px 12px;

        gap: 6px;
      }


      .chat-title {
        font-size: 17px;
      }


      #chatName {
        max-width: 150px;
      }


      #userCount {
        font-size: 11px;
      }


      #homeButton {
        min-height: 36px;

        padding: 7px 9px;

        font-size: 12px;
      }


      .header-right {
        gap: 5px;
      }


      #messages {
        padding: 14px;
      }


      .message {
        padding: 10px 12px;

        margin-bottom: 10px;

        font-size: 15px;

        border-radius: 8px;
      }


      .name {
        font-size: 11px;
      }


      .input-area {
        gap: 6px;

        padding: 8px;

        padding-bottom:
          max(8px, env(safe-area-inset-bottom));
      }


      #messageInput {
        min-height: 46px;

        padding: 11px;

        font-size: 16px;
      }


      .input-area button {
        min-width: 60px;

        padding: 11px 9px;

        font-size: 13px;
      }


      #drawButton {
        min-width: 65px;
      }


      #login {
        width: calc(100% - 28px);

        padding: 24px 20px;
      }


      #login h2 {
        font-size: 22px;

        margin-bottom: 18px;
      }


      /* Drawing popup */

      #drawingOverlay {
        padding: 10px;
      }


      #drawingBox {
        width: 100%;

        padding: 10px;

        border-radius: 10px;
      }


      #drawingCanvas {
        height: 260px;
      }


      #drawingControls {
        gap: 6px;
      }


      #drawingControls button {
        padding: 9px 6px;

        font-size: 12px;
      }

    }


    /* =========================
       VERY SMALL PHONES
       ========================= */

    @media (max-width: 360px) {

      .chat-title {
        font-size: 15px;
      }


      #chatName {
        max-width: 110px;
      }


      #userCount {
        display: none;
      }


      #homeButton {
        padding: 7px 8px;

        font-size: 11px;
      }


      #messages {
        padding: 10px;
      }


      .message {
        font-size: 14px;
      }


      .input-area button {
        min-width: 55px;

        padding-left: 7px;

        padding-right: 7px;

        font-size: 12px;
      }


      #drawButton {
        min-width: 60px;
      }

    }


    /* =========================
       LANDSCAPE PHONES
       ========================= */

    @media (
      max-height: 500px
    ) and (
      orientation: landscape
    ) {

      .chat {
        height: 100dvh;

        min-height: 100dvh;
      }


      header {
        min-height: 48px;

        padding: 7px 12px;
      }


      #messages {
        padding: 10px 14px;
      }


      .input-area {
        padding: 6px;

        padding-bottom:
          max(6px, env(safe-area-inset-bottom));
      }


      #messageInput,
      .input-area button {
        min-height: 40px;
      }


      #login {
        max-height: calc(100dvh - 20px);

        overflow-y: auto;

        padding: 18px;
      }


      #drawingCanvas {
        height: 180px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       LOGIN / JOIN SCREEN
       ========================= -->

  <div id="login">

    <h2>Join Chat</h2>


    <input
      id="username"
      type="text"
      placeholder="Your name"
      maxlength="30"
      autocomplete="name"
      autocapitalize="words"
    >


    <input
      id="chatNameInput"
      type="text"
      placeholder="Chat name"
      maxlength="50"
      autocomplete="off"
      autocapitalize="words"
    >


    <button
      onclick="joinChat()"
      type="button"
    >
      Join Chat
    </button>


    <div id="connectionStatus"></div>

  </div>



  <!-- =========================
       CHAT
       ========================= -->

  <div class="chat">


    <header>

      <div class="header-left">

        <div class="chat-title">

          💬

          <span id="chatName">
            Chat
          </span>

        </div>

      </div>


      <div class="header-right">

        <div id="userCount">
          0 / 5
        </div>


        <button
          id="homeButton"
          onclick="goHome()"
          type="button"
        >
          🏠 Home
        </button>

      </div>

    </header>



    <!-- =========================
         MESSAGES
         ========================= -->

    <div id="messages"></div>



    <!-- =========================
         MESSAGE INPUT
         ========================= -->

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        maxlength="1000"
        autocomplete="off"
        enterkeyhint="send"
        onkeydown="handleKey(event)"
      >


      <button
        id="drawButton"
        onclick="openDrawing()"
        type="button"
        disabled
      >
        ✏️ Draw
      </button>


      <button
        id="sendButton"
        onclick="sendMessage()"
        type="button"
        disabled
      >
        Send
      </button>

    </div>

  </div>



  <!-- =========================
       DRAWING POPUP
       ========================= -->

  <div id="drawingOverlay">

    <div id="drawingBox">


      <div id="drawingHeader">

        <span>
          ✏️ Draw
        </span>


        <button
          id="closeDrawingButton"
          onclick="closeDrawing()"
          type="button"
        >
          ✕
        </button>

      </div>



      <canvas
        id="drawingCanvas"
      ></canvas>



      <div id="drawingControls">

        <button
          id="clearDrawingButton"
          onclick="clearDrawing()"
          type="button"
        >
          Clear
        </button>


        <button
          id="cancelDrawingButton"
          onclick="closeDrawing()"
          type="button"
        >
          Cancel
        </button>


        <button
          id="sendDrawingButton"
          onclick="sendDrawing()"
          type="button"
        >
          Send Drawing
        </button>

      </div>

    </div>

  </div>



  <script>

    /* =========================
       GLOBAL VARIABLES
       ========================= */

    let username = "";

    let socket = null;

    let drawingCanvas = null;

    let drawingContext = null;

    let drawing = false;



    /* =========================
       JOIN CHAT
       ========================= */

    function joinChat() {

      username =
        document
          .getElementById("username")
          .value
          .trim();


      const chatName =
        document
          .getElementById("chatNameInput")
          .value
          .trim();


      const status =
        document
          .getElementById(
            "connectionStatus"
          );


      if (!username) {

        status.textContent =
          "Please enter your name.";

        document
          .getElementById("username")
          .focus();

        return;

      }


      if (!chatName) {

        status.textContent =
          "Please enter a chat name.";

        document
          .getElementById("chatNameInput")
          .focus();

        return;

      }


      status.textContent =
        "Connecting...";


      document
        .getElementById("username")
        .disabled = true;


      document
        .getElementById("chatNameInput")
        .disabled = true;



      /*
       * Connect to your WebSocket server.
       */

      socket =
        new WebSocket(
          "wss://basicchats.onrender.com"
        );



      /* =========================
         SOCKET OPEN
         ========================= */

      socket.onopen = () => {

        socket.send(
          JSON.stringify({

            type: "join",

            username:
              username,

            chatName:
              chatName

          })
        );

      };



      /* =========================
         SERVER MESSAGE
         ========================= */

      socket.onmessage = (event) => {

        let data;


        try {

          data =
            JSON.parse(
              event.data
            );

        } catch (error) {

          console.error(
            "Invalid server message:",
            event.data
          );

          return;

        }



        /* =========================
           JOIN ERROR
           ========================= */

        if (
          data.type ===
          "joinError"
        ) {

          status.textContent =
            data.message;


          document
            .getElementById(
              "username"
            )
            .disabled = false;


          document
            .getElementById(
              "chatNameInput"
            )
            .disabled = false;


          if (
            socket &&
            socket.readyState ===
              WebSocket.OPEN
          ) {

            socket.close();

          }


          return;

        }



        /* =========================
           SUCCESSFULLY JOINED
           ========================= */

        if (
          data.type ===
          "joined"
        ) {

          document
            .getElementById(
              "login"
            )
            .style.display =
              "none";


          document
            .getElementById(
              "sendButton"
            )
            .disabled = false;


          document
            .getElementById(
              "drawButton"
            )
            .disabled = false;


          document
            .getElementById(
              "chatName"
            )
            .textContent =
              data.chatName;


          updateUserCount(
            data.userCount,
            data.maxUsers
          );


          addSystemMessage(
            `You joined "${data.chatName}".`
          );


          document
            .getElementById(
              "messageInput"
            )
            .focus();


          return;

        }



        /* =========================
           USER COUNT
           ========================= */

        if (
          data.type ===
          "userCount"
        ) {

          updateUserCount(
            data.userCount,
            data.maxUsers
          );

          return;

        }



        /* =========================
           SYSTEM MESSAGE
           ========================= */

        if (
          data.type ===
          "system"
        ) {

          addSystemMessage(
            data.message
          );

          return;

        }



        /* =========================
           CHAT MESSAGE
           ========================= */

        if (
          data.type ===
          "message"
        ) {

          addMessage(
            data.username,
            data.text
          );

          return;

        }



        /* =========================
           DRAWING MESSAGE
           ========================= */

        if (
          data.type ===
          "drawing"
        ) {

          addDrawing(
            data.username,
            data.image
          );

          return;

        }

      };



      /* =========================
         CONNECTION ERROR
         ========================= */

      socket.onerror = () => {

        status.textContent =
          "Unable to connect to the chat server.";


        document
          .getElementById(
            "username"
          )
          .disabled = false;


        document
          .getElementById(
            "chatNameInput"
          )
          .disabled = false;


        document
          .getElementById(
            "sendButton"
          )
          .disabled = true;


        document
          .getElementById(
            "drawButton"
          )
          .disabled = true;

      };



      /* =========================
         DISCONNECTED
         ========================= */

      socket.onclose = () => {

        document
          .getElementById(
            "sendButton"
          )
          .disabled = true;


        document
          .getElementById(
            "drawButton"
          )
          .disabled = true;


        if (
          document
            .getElementById(
              "login"
            )
            .style
            .display ===
          "none"
        ) {

          addSystemMessage(
            "Disconnected from server."
          );

        }

      };

    }



    /* =========================
       HOME BUTTON
       ========================= */

    function goHome() {

      /*
       * Prevent the old socket's
       * onclose handler from adding
       * a "Disconnected" message.
       */

      if (socket) {

        socket.onclose = null;


        if (
          socket.readyState ===
            WebSocket.OPEN ||
          socket.readyState ===
            WebSocket.CONNECTING
        ) {

          socket.close();

        }

      }


      socket = null;

      username = "";



      /* Clear messages */

      document
        .getElementById(
          "messages"
        )
        .innerHTML = "";



      /* Reset chat name */

      document
        .getElementById(
          "chatName"
        )
        .textContent =
          "Chat";



      /* Reset user count */

      document
        .getElementById(
          "userCount"
        )
        .textContent =
          "0 / 5";



      /* Clear message */

      document
        .getElementById(
          "messageInput"
        )
        .value = "";



      /* Disable buttons */

      document
        .getElementById(
          "sendButton"
        )
        .disabled = true;


      document
        .getElementById(
          "drawButton"
        )
        .disabled = true;



      /* Reset login fields */

      document
        .getElementById(
          "username"
        )
        .disabled = false;


      document
        .getElementById(
          "chatNameInput"
        )
        .disabled = false;


      document
        .getElementById(
          "username"
        )
        .value = "";


      document
        .getElementById(
          "chatNameInput"
        )
        .value = "";



      /* Clear connection status */

      document
        .getElementById(
          "connectionStatus"
        )
        .textContent = "";



      /* Close drawing window */

      closeDrawing();



      /* Show login */

      document
        .getElementById(
          "login"
        )
        .style.display =
          "block";



      /* Focus name */

      document
        .getElementById(
          "username"
        )
        .focus();

    }



    /* =========================
       SEND MESSAGE
       ========================= */

    function sendMessage() {

      const input =
        document
          .getElementById(
            "messageInput"
          );


      const text =
        input.value.trim();


      if (
        !text ||
        !socket ||
        socket.readyState !==
          WebSocket.OPEN
      ) {

        return;

      }



      /*
       * Send the message to the
       * server.
       *
       * The server should broadcast
       * it back to everyone in the
       * same chat.
       */

      socket.send(
        JSON.stringify({

          type:
            "message",

          text:
            text

        })
      );


      input.value = "";

      input.focus();

    }



    /* =========================
       ENTER TO SEND
       ========================= */

    function handleKey(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        sendMessage();

      }

    }



    /* =========================
       USER COUNT
       ========================= */

    function updateUserCount(
      count,
      max
    ) {

      document
        .getElementById(
          "userCount"
        )
        .textContent =
          `${count} / ${max}`;

    }



    /* =========================
       DISPLAY MESSAGE
       ========================= */

    function addMessage(
      name,
      text
    ) {

      const messages =
        document
          .getElementById(
            "messages"
          );


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "message";


      const nameElement =
        document.createElement(
          "div"
        );


      nameElement.className =
        "name";


      nameElement.textContent =
        name;


      const textElement =
        document.createElement(
          "div"
        );


      textElement.textContent =
        text;


      div.appendChild(
        nameElement
      );


      div.appendChild(
        textElement
      );


      messages.appendChild(
        div
      );


      messages.scrollTop =
        messages.scrollHeight;

    }



    /* =========================
       SYSTEM MESSAGE
       ========================= */

    function addSystemMessage(
      text
    ) {

      const messages =
        document
          .getElementById(
            "messages"
          );


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "system-message";


      div.textContent =
        text;


      messages.appendChild(
        div
      );


      messages.scrollTop =
        messages.scrollHeight;

    }



    /* =========================
       OPEN DRAWING
       ========================= */

    function openDrawing() {

      const overlay =
        document
          .getElementById(
            "drawingOverlay"
          );


      drawingCanvas =
        document
          .getElementById(
            "drawingCanvas"
          );


      overlay.style.display =
        "flex";


      /*
       * Wait one frame so the
       * canvas has its correct
       * visible dimensions.
       */

      requestAnimationFrame(
        () => {

          setupDrawingCanvas();

        }
      );

    }



    /* =========================
       CLOSE DRAWING
       ========================= */

    function closeDrawing() {

      document
        .getElementById(
          "drawingOverlay"
        )
        .style.display =
          "none";


      drawing = false;

    }



    /* =========================
       SETUP CANVAS
       ========================= */

    function setupDrawingCanvas() {

      if (!drawingCanvas) {

        drawingCanvas =
          document
            .getElementById(
              "drawingCanvas"
            );

      }


      const rect =
        drawingCanvas
          .getBoundingClientRect();


      const devicePixelRatio =
        window.devicePixelRatio ||
        1;


      drawingCanvas.width =
        Math.max(
          1,
          Math.floor(
            rect.width *
            devicePixelRatio
          )
        );


      drawingCanvas.height =
        Math.max(
          1,
          Math.floor(
            rect.height *
            devicePixelRatio
          )
        );


      drawingContext =
        drawingCanvas.getContext(
          "2d"
        );


      drawingContext.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
      );


      /*
       * White background.
       */

      drawingContext.fillStyle =
        "#ffffff";


      drawingContext.fillRect(
        0,
        0,
        rect.width,
        rect.height
      );


      /*
       * Black pen.
       */

      drawingContext.strokeStyle =
        "#000000";


      drawingContext.fillStyle =
        "#000000";


      drawingContext.lineWidth =
        3;


      drawingContext.lineCap =
        "round";


      drawingContext.lineJoin =
        "round";

    }



    /* =========================
       GET POINTER POSITION
       ========================= */

    function getDrawingPosition(
      event
    ) {

      const rect =
        drawingCanvas
          .getBoundingClientRect();


      return {

        x:
          event.clientX -
          rect.left,

        y:
          event.clientY -
          rect.top

      };

    }



    /* =========================
       START DRAWING
       ========================= */

    function startDrawing(
      event
    ) {

      if (
        document
          .getElementById(
            "drawingOverlay"
          )
          .style
          .display !==
        "flex"
      ) {

        return;

      }


      event.preventDefault();


      drawing = true;


      if (
        drawingCanvas
          .setPointerCapture
      ) {

        try {

          drawingCanvas
            .setPointerCapture(
              event.pointerId
            );

        } catch (error) {

          /*
           * Some browsers may not
           * support pointer capture.
           */

        }

      }


      const position =
        getDrawingPosition(
          event
        );


      drawingContext.beginPath();


      drawingContext.moveTo(
        position.x,
        position.y
      );

    }



    /* =========================
       DRAW
       ========================= */

    function draw(
      event
    ) {

      if (!drawing) {

        return;

      }


      event.preventDefault();


      const position =
        getDrawingPosition(
          event
        );


      drawingContext.lineTo(
        position.x,
        position.y
      );


      drawingContext.stroke();

    }



    /* =========================
       STOP DRAWING
       ========================= */

    function stopDrawing(
      event
    ) {

      if (event) {

        event.preventDefault();

      }


      drawing = false;


      if (drawingContext) {

        drawingContext.closePath();

      }

    }



    /* =========================
       CLEAR DRAWING
       ========================= */

    function clearDrawing() {

      if (
        !drawingCanvas ||
        !drawingContext
      ) {

        return;

      }


      const rect =
        drawingCanvas
          .getBoundingClientRect();


      drawingContext.setTransform(
        window.devicePixelRatio ||
          1,
        0,
        0,
        window.devicePixelRatio ||
          1,
        0,
        0
      );


      drawingContext.fillStyle =
        "#ffffff";


      drawingContext.fillRect(
        0,
        0,
        rect.width,
        rect.height
      );


      drawingContext.strokeStyle =
        "#000000";


      drawingContext.fillStyle =
        "#000000";


      drawingContext.lineWidth =
        3;


      drawingContext.lineCap =
        "round";


      drawingContext.lineJoin =
        "round";

    }



    /* =========================
       SEND DRAWING
       ========================= */
function sendDrawing() {

  if (!socket || socket.readyState !== WebSocket.OPEN) {
    alert("You are not connected to the chat.");
    return;
  }

  if (!drawingCanvas) {
    alert("Drawing canvas is not ready.");
    return;
  }

  const image = drawingCanvas.toDataURL("image/png");

  socket.send(

    })

    /* =========================
       DISPLAY DRAWING
       ========================= */

    function addDrawing(
      name,
      image
    ) {

      const messages =
        document
          .getElementById(
            "messages"
          );


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "drawing-message";


      const nameElement =
        document.createElement(
          "div"
        );


      nameElement.className =
        "name";


      nameElement.textContent =
        name;


      const imageElement =
        document.createElement(
          "img"
        );


      imageElement.className =
        "drawing-image";


      imageElement.src =
        image;


      imageElement.alt =
        `${name}'s drawing`;


      div.appendChild(
        nameElement
      );


      div.appendChild(
        imageElement
      );


      messages.appendChild(
        div
      );


      messages.scrollTop =
        messages.scrollHeight;

    }



    /* =========================
       CANVAS POINTER EVENTS
       ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        drawingCanvas =
          document
            .getElementById(
              "drawingCanvas"
            );


        drawingCanvas.addEventListener(
          "pointerdown",
          startDrawing
        );


        drawingCanvas.addEventListener(
          "pointermove",
          draw
        );


        drawingCanvas.addEventListener(
          "pointerup",
          stopDrawing
        );


        drawingCanvas.addEventListener(
          "pointercancel",
          stopDrawing
        );


        drawingCanvas.addEventListener(
          "pointerleave",
          stopDrawing
        );

      }
    );



    /* =========================
       ESCAPE CLOSES DRAWING
       ========================= */

    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key ===
          "Escape"
        ) {

          const overlay =
            document
              .getElementById(
                "drawingOverlay"
              );


          if (
            overlay.style.display ===
            "flex"
          ) {

            closeDrawing();

          }

        }

      }
    );

  </script>

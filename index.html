  <script>


    // ========================================================
    // DOM ELEMENTS
    // ========================================================

    const homeScreen =
      document.getElementById(
        "homeScreen"
      );


    const app =
      document.getElementById(
        "app"
      );


    const roomInput =
      document.getElementById(
        "roomInput"
      );


    const joinButton =
      document.getElementById(
        "joinButton"
      );


    const homeError =
      document.getElementById(
        "homeError"
      );


    const homeButton =
      document.getElementById(
        "homeButton"
      );


    const roomTitle =
      document.getElementById(
        "roomTitle"
      );


    const userCount =
      document.getElementById(
        "userCount"
      );


    const messages =
      document.getElementById(
        "messages"
      );


    const messageInput =
      document.getElementById(
        "messageInput"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    const gameStatus =
      document.getElementById(
        "gameStatus"
      );


    const gameInfo =
      document.getElementById(
        "gameInfo"
      );


    const checkersBoard =
      document.getElementById(
        "checkersBoard"
      );


    // ========================================================
    // CONNECTION STATE
    // ========================================================

    let socket = null;

    let currentRoom = "";

    let joined = false;


    // ========================================================
    // CHECKERS CLIENT STATE
    // ========================================================

    let checkerColor = null;

    let board = [];

    let currentTurn = "red";

    let gameOver = false;

    let winner = null;

    let selectedSquare = null;


    // ========================================================
    // TAB SYSTEM
    // ========================================================

    const tabButtons =
      document.querySelectorAll(
        ".tabButton"
      );


    const pages =
      document.querySelectorAll(
        ".page"
      );


    tabButtons.forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const pageId =
            button.dataset.page;


          tabButtons.forEach(btn => {

            btn.classList.remove(
              "active"
            );

          });


          pages.forEach(page => {

            page.classList.remove(
              "active"
            );

          });


          button.classList.add(
            "active"
          );


          document
            .getElementById(pageId)
            .classList.add(
              "active"
            );

        }
      );

    });


    // ========================================================
    // JOIN ROOM
    // ========================================================

    function joinRoom() {

      const room =
        roomInput.value.trim();


      if (!room) {

        homeError.textContent =
          "Please enter a room name.";

        return;

      }


      homeError.textContent = "";


      currentRoom = room;


      roomTitle.textContent =
        "Room: " + currentRoom;


      homeScreen.style.display =
        "none";


      app.style.display =
        "flex";


      connectWebSocket();

    }


    joinButton.addEventListener(
      "click",
      joinRoom
    );


    roomInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          joinRoom();

        }

      }
    );


    // ========================================================
    // HOME BUTTON
    // ========================================================

    homeButton.addEventListener(
      "click",
      () => {

        joined = false;


        if (socket) {

          try {

            socket.close();

          } catch (error) {}

          socket = null;

        }


        currentRoom = "";

        checkerColor = null;

        selectedSquare = null;


        app.style.display =
          "none";


        homeScreen.style.display =
          "flex";


        roomInput.value = "";

        messages.innerHTML = "";


        userCount.textContent =
          "Disconnected";


        gameStatus.textContent =
          "Not connected";


        gameInfo.textContent =
          "Enter a room to play.";

      }
    );


    // ========================================================
    // WEBSOCKET CONNECTION
    // ========================================================

    function connectWebSocket() {

      if (socket) {

        try {
          socket.close();
        } catch (error) {}

      }


      const protocol =
        window.location.protocol ===
        "https:"
          ? "wss:"
          : "ws:";


      const wsUrl =
        protocol +
        "//" +
        window.location.host;


      socket =
        new WebSocket(
          wsUrl
        );


      socket.addEventListener(
        "open",
        () => {

          userCount.textContent =
            "Connected";


          sendSocketData({

            type: "join",

            room:
              currentRoom

          });

        }
      );


      socket.addEventListener(
        "message",
        event => {

          handleSocketMessage(
            event.data
          );

        }
      );


      socket.addEventListener(
        "close",
        () => {

          joined = false;


          userCount.textContent =
            "Disconnected";


          gameStatus.textContent =
            "Disconnected";

        }
      );


      socket.addEventListener(
        "error",
        () => {

          userCount.textContent =
            "Connection error";

        }
      );

    }


    // ========================================================
    // SEND SOCKET DATA
    // ========================================================

    function sendSocketData(data) {

      if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
      ) {

        socket.send(
          JSON.stringify(data)
        );

      }

    }


    // ========================================================
    // HANDLE SOCKET MESSAGE
    // ========================================================

    function handleSocketMessage(
      rawData
    ) {

      let data;


      try {

        data =
          JSON.parse(
            rawData
          );

      } catch (error) {

        return;

      }


      // ======================================================
      // JOINED
      // ======================================================

      if (
        data.type === "joined"
      ) {

        joined = true;


        currentRoom =
          data.room;


        roomTitle.textContent =
          "Room: " +
          currentRoom;


        checkerColor =
          data.checkerColor ||
          null;


        updateCheckerInfo();


        return;

      }


      // ======================================================
      // USER COUNT
      // ======================================================

      if (
        data.type ===
        "userCount"
      ) {

        updateUserCount(
          data.count
        );

        return;

      }


      // ======================================================
      // ROOM FULL
      // ======================================================

      if (
        data.type ===
        "roomFull"
      ) {

        app.style.display =
          "none";


        homeScreen.style.display =
          "flex";


        homeError.textContent =
          data.message ||
          "Room is full.";


        if (socket) {

          try {
            socket.close();
          } catch (error) {}

          socket = null;

        }


        return;

      }


      // ======================================================
      // SYSTEM MESSAGE
      // ======================================================

      if (
        data.type ===
        "system"
      ) {

        addSystemMessage(
          data.message
        );

        return;

      }


      // ======================================================
      // CHAT
      // ======================================================

      if (
        data.type ===
        "chat"
      ) {

        addMessage(
          data.message
        );

        return;

      }


      // ======================================================
      // ERROR
      // ======================================================

      if (
        data.type ===
        "error"
      ) {

        addSystemMessage(
          data.message
        );

        return;

      }


      // ======================================================
      // CHECKERS STATE
      // ======================================================

      if (
        data.type ===
        "checkersState"
      ) {

        applyCheckersState(
          data.state
        );

        return;

      }


      // ======================================================
      // CHECKERS MOVE
      // ======================================================

      if (
        data.type ===
        "checkersMove"
      ) {

        applyServerMove(
          data
        );

        return;

      }

    }


    // ========================================================
    // USER COUNT DISPLAY
    // ========================================================

    function updateUserCount(
      count
    ) {

      userCount.textContent =
        count +
        (
          count === 1
            ? " user"
            : " users"
        );

    }


    // ========================================================
    // CHAT
    // ========================================================

    function addMessage(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "message";


      div.textContent =
        text;


      messages.appendChild(
        div
      );


      messages.scrollTop =
        messages.scrollHeight;

    }


    function addSystemMessage(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "message system";


      div.textContent =
        text;


      messages.appendChild(
        div
      );


      messages.scrollTop =
        messages.scrollHeight;

    }


    function sendChatMessage() {

      const text =
        messageInput.value.trim();


      if (!text) {
        return;
      }


      sendSocketData({

        type: "chat",

        message:
          text

      });


      messageInput.value = "";


      messageInput.focus();

    }


    sendButton.addEventListener(
      "click",
      sendChatMessage
    );


    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendChatMessage();

        }

      }
    );


    // ========================================================
    // DRAWING
    // ========================================================

    const canvas =
      document.getElementById(
        "drawingCanvas"
      );


    const ctx =
      canvas.getContext(
        "2d"
      );


    let drawing = false;

    let lastX = 0;

    let lastY = 0;

    let drawingColor =
      "#000000";


    ctx.lineWidth = 4;

    ctx.lineCap =
      "round";

    ctx.lineJoin =
      "round";


    /*
      IMPORTANT:

      Drawing data is sent as individual
      line segments so every connected
      user sees the drawing.
    */


    document
      .querySelectorAll(
        ".colorButton"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".colorButton"
              )
              .forEach(btn => {

                btn.classList.remove(
                  "selected"
                );

              });


            button.classList.add(
              "selected"
            );


            drawingColor =
              button.dataset.color;

          }
        );

      });


    function getCanvasPosition(
      event
    ) {

      const rect =
        canvas.getBoundingClientRect();


      let clientX;
      let clientY;


      if (
        event.touches &&
        event.touches.length
      ) {

        clientX =
          event.touches[0].clientX;

        clientY =
          event.touches[0].clientY;

      } else {

        clientX =
          event.clientX;

        clientY =
          event.clientY;

      }


      return {

        x:
          (
            clientX -
            rect.left
          ) *
          (
            canvas.width /
            rect.width
          ),

        y:
          (
            clientY -
            rect.top
          ) *
          (
            canvas.height /
            rect.height
          )

      };

    }


    function startDrawing(
      event
    ) {

      event.preventDefault();


      drawing = true;


      const position =
        getCanvasPosition(
          event
        );


      lastX =
        position.x;


      lastY =
        position.y;

    }


    function draw(
      event
    ) {

      if (!drawing) {
        return;
      }


      event.preventDefault();


      const position =
        getCanvasPosition(
          event
        );


      drawLine(
        lastX,
        lastY,
        position.x,
        position.y,
        drawingColor
      );


      /*
        Send drawing segment to everyone.
      */

      sendSocketData({

        type:
          "drawing",

        x1:
          lastX,

        y1:
          lastY,

        x2:
          position.x,

        y2:
          position.y,

        color:
          drawingColor

      });


      lastX =
        position.x;


      lastY =
        position.y;

    }


    function drawLine(
      x1,
      y1,
      x2,
      y2,
      color
    ) {

      ctx.strokeStyle =
        color;


      ctx.beginPath();


      ctx.moveTo(
        x1,
        y1
      );


      ctx.lineTo(
        x2,
        y2
      );


      ctx.stroke();

    }


    function stopDrawing() {

      drawing = false;

    }


    canvas.addEventListener(
      "mousedown",
      startDrawing
    );


    canvas.addEventListener(
      "mousemove",
      draw
    );


    canvas.addEventListener(
      "mouseup",
      stopDrawing
    );


    canvas.addEventListener(
      "mouseleave",
      stopDrawing
    );


    canvas.addEventListener(
      "touchstart",
      startDrawing,
      {
        passive: false
      }
    );


    canvas.addEventListener(
      "touchmove",
      draw,
      {
        passive: false
      }
    );


    canvas.addEventListener(
      "touchend",
      stopDrawing
    );


    document
      .getElementById(
        "clearCanvas"
      )
      .addEventListener(
        "click",
        () => {

          clearCanvas();


          sendSocketData({

            type:
              "drawingClear"

          });

        }
      );


    function clearCanvas() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

    }


    // ========================================================
    // CHECKERS STATE
    // ========================================================

    function createEmptyBoard() {

      const newBoard = [];


      for (
        let row = 0;
        row < 8;
        row++
      ) {

        newBoard[row] = [];


        for (
          let col = 0;
          col < 8;
          col++
        ) {

          newBoard[row][col] =
            null;

        }

      }


      return newBoard;

    }


    function applyCheckersState(
      state
    ) {

      if (!state) {
        return;
      }


      if (
        !Array.isArray(
          state.board
        )
      ) {

        return;

      }


      board =
        state.board;


      currentTurn =
        state.turn;


      gameOver =
        !!state.gameOver;


      winner =
        state.winner ||
        null;


      selectedSquare =
        null;


      renderCheckers();

      updateCheckerInfo();

    }


    // ========================================================
    // CHECKERS SERVER MOVE
    // ========================================================

    function applyServerMove(
      data
    ) {

      const move =
        data.move;


      if (!move) {
        return;
      }


      /*
        The server sends the already
        validated move.

        The client does NOT independently
        decide whether the move is legal.
      */


      if (
        !board[move.fromRow]
      ) {
        return;
      }


      const piece =
        board[
          move.fromRow
        ][
          move.fromCol
        ];


      /*
        Remove captured piece.
      */

      if (
        move.captured
      ) {

        board[
          move.captured.row
        ][
          move.captured.col
        ] = null;

      }


      /*
        Move piece.
      */

      board[
        move.fromRow
      ][
        move.fromCol
      ] = null;


      board[
        move.toRow
      ][
        move.toCol
      ] =
        move.piece ||
        piece;


      /*
        IMPORTANT:

        Use the server's turn.
      */

      currentTurn =
        data.turn;


      gameOver =
        !!data.gameOver;


      winner =
        data.winner ||
        null;


      selectedSquare =
        null;


      renderCheckers();

      updateCheckerInfo();

    }


    // ========================================================
    // CHECKERS PIECE HELPERS
    // ========================================================

    function getPieceColor(
      piece
    ) {

      if (
        piece === "red" ||
        piece === "redKing"
      ) {

        return "red";

      }


      if (
        piece === "black" ||
        piece === "blackKing"
      ) {

        return "black";

      }


      return null;

    }


    function isKing(
      piece
    ) {

      return (
        piece === "redKing" ||
        piece === "blackKing"
      );

    }


    // ========================================================
    // CLIENT-SIDE MOVE DISPLAY
    // ========================================================
    //
    // This does NOT validate the actual game.
    //
    // The server is authoritative.
    //
    // This function only determines which
    // squares should be highlighted.
    // ========================================================

    function isPossibleMove(
      fromRow,
      fromCol,
      toRow,
      toCol
    ) {

      if (
        !board[fromRow] ||
        !board[toRow]
      ) {

        return false;

      }


      const piece =
        board[
          fromRow
        ][
          fromCol
        ];


      if (!piece) {
        return false;
      }


      if (
        getPieceColor(piece) !==
        checkerColor
      ) {

        return false;

      }


      if (
        currentTurn !==
        checkerColor
      ) {

        return false;

      }


      if (
        board[
          toRow
        ][
          toCol
        ] !== null
      ) {

        return false;

      }


      if (
        (toRow + toCol) % 2 === 0
      ) {

        return false;

      }


      const rowDifference =
        toRow -
        fromRow;


      const colDifference =
        toCol -
        fromCol;


      const absRow =
        Math.abs(
          rowDifference
        );


      const absCol =
        Math.abs(
          colDifference
        );


      /*
        Normal move.
      */

      if (
        absRow === 1 &&
        absCol === 1
      ) {

        if (
          isKing(piece)
        ) {

          return true;

        }


        if (
          checkerColor ===
          "red"
        ) {

          return (
            rowDifference === -1
          );

        }


        return (
          rowDifference === 1
        );

      }


      /*
        Capture.
      */

      if (
        absRow === 2 &&
        absCol === 2
      ) {

        const middleRow =
          fromRow +
          rowDifference / 2;


        const middleCol =
          fromCol +
          colDifference / 2;


        const middlePiece =
          board[
            middleRow
          ][
            middleCol
          ];


        if (!middlePiece) {
          return false;
        }


        if (
          getPieceColor(
            middlePiece
          ) ===
          checkerColor
        ) {

          return false;

        }


        if (
          isKing(piece)
        ) {

          return true;

        }


        if (
          checkerColor ===
          "red"
        ) {

          return (
            rowDifference === -2
          );

        }


        return (
          rowDifference === 2
        );

      }


      return false;

    }


    // ========================================================
    // CHECKERS CLICK
    // ========================================================

    function handleCheckerClick(
      row,
      col
    ) {

      if (gameOver) {
        return;
      }


      /*
        Spectators cannot move.
      */

      if (!checkerColor) {
        return;
      }


      /*
        Not your turn.
      */

      if (
        currentTurn !==
        checkerColor
      ) {

        return;
      }


      const piece =
        board[row][col];


      /*
        No piece selected.
      */

      if (!selectedSquare) {

        if (
          piece &&
          getPieceColor(piece) ===
          checkerColor
        ) {

          selectedSquare = {
            row,
            col
          };


          renderCheckers();

        }

        return;

      }


      /*
        Selecting another one
        of your pieces.
      */

      if (
        piece &&
        getPieceColor(piece) ===
        checkerColor
      ) {

        selectedSquare = {
          row,
          col
        };


        renderCheckers();

        return;

      }


      /*
        Try to send move.

        The server will decide whether
        it is actually legal.
      */

      if (
        isPossibleMove(
          selectedSquare.row,
          selectedSquare.col,
          row,
          col
        )
      ) {

        sendSocketData({

          type:
            "checkersMove",

          move: {

            fromRow:
              selectedSquare.row,

            fromCol:
              selectedSquare.col,

            toRow:
              row,

            toCol:
              col

          }

        });


        selectedSquare =
          null;


        renderCheckers();

      } else {

        selectedSquare =
          null;


        renderCheckers();

      }

    }


    // ========================================================
    // RENDER CHECKERS
    // ========================================================

    function renderCheckers() {

      checkersBoard.innerHTML = "";


      for (
        let row = 0;
        row < 8;
        row++
      ) {

        for (
          let col = 0;
          col < 8;
          col++
        ) {

          const square =
            document.createElement(
              "div"
            );


          square.classList.add(
            "square"
          );


          if (
            (row + col) % 2 === 0
          ) {

            square.classList.add(
              "lightSquare"
            );

          } else {

            square.classList.add(
              "darkSquare"
            );

          }


          /*
            Selected square.
          */

          if (
            selectedSquare &&
            selectedSquare.row ===
              row &&
            selectedSquare.col ===
              col
          ) {

            square.classList.add(
              "selected"
            );

          }


          /*
            Possible destination.
          */

          if (
            selectedSquare &&
            isPossibleMove(
              selectedSquare.row,
              selectedSquare.col,
              row,
              col
            )
          ) {

            square.classList.add(
              "validMove"
            );

          }


          const piece =
            board[row] &&
            board[row][col];


          if (piece) {

            const pieceElement =
              document.createElement(
                "div"
              );


            pieceElement.classList.add(
              "piece"
            );


            if (
              piece === "red" ||
              piece === "redKing"
            ) {

              pieceElement.classList.add(
                "redPiece"
              );

            } else {

              pieceElement.classList.add(
                "blackPiece"
              );

            }


            if (
              isKing(piece)
            ) {

              pieceElement.classList.add(
                "king"
              );

            }


            square.appendChild(
              pieceElement
            );

          }


          square.addEventListener(
            "click",
            () => {

              handleCheckerClick(
                row,
                col
              );

            }
          );


          checkersBoard.appendChild(
            square
          );

        }

      }


      updateCheckerStatus();

    }


    // ========================================================
    // CHECKERS STATUS
    // ========================================================

    function updateCheckerStatus() {

      if (gameOver) {

        if (winner) {

          if (
            winner ===
            checkerColor
          ) {

            gameStatus.textContent =
              "You win!";

          } else {

            gameStatus.textContent =
              capitalize(
                winner
              ) +
              " wins!";

          }

        } else {

          gameStatus.textContent =
            "Game over";

        }


        return;

      }


      if (!checkerColor) {

        gameStatus.textContent =
          capitalize(
            currentTurn
          ) +
          "'s turn";


        return;

      }


      if (
        currentTurn ===
        checkerColor
      ) {

        gameStatus.textContent =
          "Your turn!";

      } else {

        gameStatus.textContent =
          capitalize(
            currentTurn
          ) +
          "'s turn";

      }

    }


    function updateCheckerInfo() {

      if (!joined) {

        gameInfo.textContent =
          "Connecting to the game...";

        return;

      }


      if (checkerColor === "red") {

        gameInfo.textContent =
          "You are Red. Red moves first.";

      } else if (
        checkerColor === "black"
      ) {

        gameInfo.textContent =
          "You are Black.";

      } else {

        gameInfo.textContent =
          "You are watching. The two checker players are already assigned.";

      }


      updateCheckerStatus();

    }


    function capitalize(
      text
    ) {

      if (!text) {
        return "";
      }


      return (
        text.charAt(0).toUpperCase() +
        text.slice(1)
      );

    }


    // ========================================================
    // NEW CHECKERS GAME
    // ========================================================

    document
      .getElementById(
        "newGameButton"
      )
      .addEventListener(
        "click",
        () => {

          sendSocketData({

            type:
              "checkersReset"

          });

        }
      );


    // ========================================================
    // INITIAL CHECKERS BOARD
    // ========================================================

    board =
      createEmptyBoard();


    renderCheckers();

  </script>

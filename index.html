<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Basic Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }


    /* ========================================================
       HOME PAGE
       ======================================================== */

    #homePage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .homeCard {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 18px;
      padding: 35px 25px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .homeCard h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .homeCard p {
      margin: 0 0 25px;
      color: #666;
    }

    #roomInput {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 17px;
      margin-bottom: 12px;
      outline: none;
    }

    #roomInput:focus {
      border-color: #333;
    }

    #joinButton {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-weight: bold;
      font-size: 17px;
    }

    #joinButton:hover {
      background: #000;
    }

    #homeError {
      color: #c62828;
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
    }


    /* ========================================================
       APP
       ======================================================== */

    #appPage {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }


    /* ========================================================
       TOP BAR
       ======================================================== */

    .topBar {
      background: #222;
      color: white;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .roomInfo {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .roomNameDisplay {
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #userCount {
      background: #444;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
    }

    #checkerRole {
      background: #444;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
    }

    #homeButton {
      border: none;
      background: white;
      color: #222;
      padding: 8px 13px;
      border-radius: 8px;
      font-weight: bold;
    }

    #homeButton:hover {
      background: #ddd;
    }


    /* ========================================================
       TABS
       ======================================================== */

    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .tabButton {
      flex: 1;
      border: none;
      background: white;
      padding: 14px 10px;
      font-weight: bold;
      color: #666;
      border-bottom: 3px solid transparent;
    }

    .tabButton.active {
      color: #222;
      border-bottom-color: #222;
    }


    /* ========================================================
       CONTENT
       ======================================================== */

    .content {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px;
    }

    .tabContent {
      display: none;
      width: 100%;
    }

    .tabContent.active {
      display: block;
    }


    /* ========================================================
       CHAT
       ======================================================== */

    .chatContainer {
      height: calc(100vh - 130px);
      min-height: 450px;
      display: flex;
      flex-direction: column;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px 13px;
      border-radius: 10px;
      background: #f0f0f0;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .systemMessage {
      background: #fff4d6;
      color: #795600;
      font-size: 14px;
      text-align: center;
    }

    .chatInputArea {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: #fafafa;
    }

    #chatInput {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      outline: none;
    }

    #sendButton {
      border: none;
      background: #222;
      color: white;
      border-radius: 9px;
      padding: 0 18px;
      font-weight: bold;
    }


    /* ========================================================
       DRAWING
       ======================================================== */

    .drawingContainer {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .drawingToolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .toolbarLabel {
      font-weight: bold;
      margin-right: 3px;
    }

    .colorButton {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid transparent;
      padding: 0;
    }

    .colorButton.selected {
      border-color: #222;
      transform: scale(1.1);
    }

    .colorBlack {
      background: #000;
    }

    .colorRed {
      background: #e53935;
    }

    .colorBlue {
      background: #1e88e5;
    }

    .colorGreen {
      background: #43a047;
    }

    .colorYellow {
      background: #fdd835;
    }

    .colorPurple {
      background: #8e24aa;
    }

    .colorOrange {
      background: #fb8c00;
    }

    #clearDrawingButton {
      margin-left: auto;
      border: none;
      background: #e53935;
      color: white;
      padding: 9px 13px;
      border-radius: 8px;
      font-weight: bold;
    }

    #canvasWrapper {
      width: 100%;
      overflow: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }

    #drawingCanvas {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      touch-action: none;
    }


    /* ========================================================
       CHECKERS
       ======================================================== */

    .checkersContainer {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    #checkersStatus {
      font-weight: bold;
      margin-bottom: 15px;
      min-height: 24px;
    }

    #newGameButton {
      border: none;
      background: #222;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    #checkersBoard {
      width: min(90vw, 600px);
      height: min(90vw, 600px);
      max-width: 600px;
      max-height: 600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 4px solid #222;
    }

    .checkerSquare {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightSquare {
      background: #f0d9b5;
    }

    .darkSquare {
      background: #b58863;
    }

    .checkerPiece {
      width: 72%;
      height: 72%;
      border-radius: 50%;
      border: 3px solid rgba(0, 0, 0, 0.25);
      box-shadow:
        0 3px 5px rgba(0, 0, 0, 0.25),
        inset 0 2px 3px rgba(255, 255, 255, 0.25);
      position: relative;
      cursor: pointer;
    }

    .redPiece {
      background: #d32f2f;
    }

    .blackPiece {
      background: #222;
    }

    .kingPiece::after {
      content: "K";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: clamp(12px, 3vw, 25px);
      font-weight: bold;
    }

    .selectedChecker {
      outline: 4px solid #2196f3;
      outline-offset: -4px;
    }

    .possibleMove {
      box-shadow: inset 0 0 0 5px rgba(33, 150, 243, 0.75);
      cursor: pointer;
    }

    .captureMove {
      box-shadow: inset 0 0 0 5px rgba(255, 193, 7, 0.9);
    }


    /* ========================================================
       ERROR / CONNECTION STATUS
       ======================================================== */

    #connectionStatus {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 13px;
      display: none;
      z-index: 1000;
    }

    #connectionStatus.error {
      background: #c62828;
    }

    #connectionStatus.success {
      background: #2e7d32;
    }


    /* ========================================================
       MOBILE
       ======================================================== */

    @media (max-width: 600px) {

      .homeCard {
        padding: 28px 18px;
      }

      .homeCard h1 {
        font-size: 27px;
      }

      .topBar {
        padding: 8px 10px;
      }

      .roomInfo {
        flex: 1;
        flex-wrap: wrap;
      }

      .roomNameDisplay {
        max-width: 130px;
      }

      #homeButton {
        padding: 8px 10px;
      }

      .content {
        padding: 8px;
      }

      .chatContainer {
        height: calc(100vh - 115px);
        min-height: 350px;
        border-radius: 8px;
      }

      .chatInputArea {
        padding: 8px;
      }

      #chatInput {
        padding: 11px;
      }

      #sendButton {
        padding: 0 14px;
      }

      .drawingContainer,
      .checkersContainer {
        padding: 8px;
      }

      .drawingToolbar {
        gap: 7px;
      }

      .colorButton {
        width: 29px;
        height: 29px;
      }

      #clearDrawingButton {
        margin-left: 0;
      }

      #checkersBoard {
        width: min(96vw, 600px);
        height: min(96vw, 600px);
        border-width: 3px;
      }
    }


    @media (max-width: 400px) {

      .tabButton {
        padding: 12px 5px;
        font-size: 13px;
      }

      #userCount,
      #checkerRole {
        font-size: 11px;
        padding: 4px 7px;
      }

      .roomNameDisplay {
        max-width: 100px;
      }
    }
  </style>
</head>

<body>


  <!-- ======================================================
       HOME PAGE
       ====================================================== -->

  <div id="homePage">

    <div class="homeCard">

      <h1>Basic Chat</h1>

      <p>
        Enter a room name to create or join a chat room.
      </p>

      <input
        id="roomInput"
        type="text"
        maxlength="40"
        placeholder="Enter room name"
        autocomplete="off"
      >

      <button id="joinButton">
        Join Room
      </button>

      <div id="homeError"></div>

    </div>

  </div>


  <!-- ======================================================
       APP PAGE
       ====================================================== -->

  <div id="appPage">


    <!-- ====================================================
         TOP BAR
         ==================================================== -->

    <div class="topBar">

      <div class="roomInfo">

        <div class="roomNameDisplay">
          Room: <span id="roomNameDisplay">---</span>
        </div>

        <div id="userCount">
          0 / 5 users
        </div>

        <div id="checkerRole">
          Spectator
        </div>

      </div>

      <button id="homeButton">
        Home
      </button>

    </div>


    <!-- ====================================================
         TABS
         ==================================================== -->

    <div class="tabs">

      <button
        class="tabButton active"
        data-tab="chatTab"
      >
        Chat
      </button>

      <button
        class="tabButton"
        data-tab="drawingTab"
      >
        Drawing
      </button>

      <button
        class="tabButton"
        data-tab="checkersTab"
      >
        Checkers
      </button>

    </div>


    <!-- ====================================================
         CONTENT
         ==================================================== -->

    <div class="content">


      <!-- ==================================================
           CHAT TAB
           ================================================== -->

      <div
        id="chatTab"
        class="tabContent active"
      >

        <div class="chatContainer">

          <div id="messages"></div>

          <div class="chatInputArea">

            <input
              id="chatInput"
              type="text"
              maxlength="1000"
              placeholder="Type a message..."
              autocomplete="off"
            >

            <button id="sendButton">
              Send
            </button>

          </div>

        </div>

      </div>


      <!-- ==================================================
           DRAWING TAB
           ================================================== -->

      <div
        id="drawingTab"
        class="tabContent"
      >

        <div class="drawingContainer">

          <div class="drawingToolbar">

            <span class="toolbarLabel">
              Color:
            </span>

            <button
              class="colorButton colorBlack selected"
              data-color="#000000"
              title="Black"
            ></button>

            <button
              class="colorButton colorRed"
              data-color="#e53935"
              title="Red"
            ></button>

            <button
              class="colorButton colorBlue"
              data-color="#1e88e5"
              title="Blue"
            ></button>

            <button
              class="colorButton colorGreen"
              data-color="#43a047"
              title="Green"
            ></button>

            <button
              class="colorButton colorYellow"
              data-color="#fdd835"
              title="Yellow"
            ></button>

            <button
              class="colorButton colorPurple"
              data-color="#8e24aa"
              title="Purple"
            ></button>

            <button
              class="colorButton colorOrange"
              data-color="#fb8c00"
              title="Orange"
            ></button>

            <button id="clearDrawingButton">
              Clear
            </button>

          </div>


          <div id="canvasWrapper">

            <canvas
              id="drawingCanvas"
              width="1200"
              height="800"
            ></canvas>

          </div>

        </div>

      </div>


      <!-- ==================================================
           CHECKERS TAB
           ================================================== -->

      <div
        id="checkersTab"
        class="tabContent"
      >

        <div class="checkersContainer">

          <div id="checkersStatus">
            Waiting for game...
          </div>

          <button id="newGameButton">
            New Game
          </button>

          <div id="checkersBoard"></div>

        </div>

      </div>

    </div>

  </div>


  <!-- ======================================================
       CONNECTION STATUS
       ====================================================== -->

  <div id="connectionStatus"></div>


  <script>

    // ========================================================
    // ELEMENTS
    // ========================================================

    const homePage =
      document.getElementById("homePage");

    const appPage =
      document.getElementById("appPage");

    const roomInput =
      document.getElementById("roomInput");

    const joinButton =
      document.getElementById("joinButton");

    const homeError =
      document.getElementById("homeError");

    const homeButton =
      document.getElementById("homeButton");

    const roomNameDisplay =
      document.getElementById("roomNameDisplay");

    const userCount =
      document.getElementById("userCount");

    const checkerRole =
      document.getElementById("checkerRole");

    const messages =
      document.getElementById("messages");

    const chatInput =
      document.getElementById("chatInput");

    const sendButton =
      document.getElementById("sendButton");

    const connectionStatus =
      document.getElementById("connectionStatus");

    const checkersStatus =
      document.getElementById("checkersStatus");

    const newGameButton =
      document.getElementById("newGameButton");

    const checkersBoard =
      document.getElementById("checkersBoard");

    const canvas =
      document.getElementById("drawingCanvas");

    const ctx =
      canvas.getContext("2d");


    // ========================================================
    // STATE
    // ========================================================

    let socket = null;

    let currentRoom = "";

    let checkerColor = null;

    let checkersState = {
      board: [],
      turn: "red",
      gameOver: false,
      winner: null
    };

    let selectedChecker = null;

    let drawing = false;

    let lastX = 0;

    let lastY = 0;

    let currentColor = "#000000";


    // ========================================================
    // CONNECTION STATUS
    // ========================================================

    function showStatus(message, type = "") {

      connectionStatus.textContent =
        message;

      connectionStatus.className =
        type;

      connectionStatus.style.display =
        "block";

      clearTimeout(
        showStatus.timeout
      );

      showStatus.timeout =
        setTimeout(() => {

          connectionStatus.style.display =
            "none";

        }, 3000);
    }


    // ========================================================
    // WEBSOCKET URL
    // ========================================================

function getWebSocketURL() {
  return "wss://basicchats.onrender.com";
}

    // ========================================================
    // CONNECT
    // ========================================================

    function connectToServer(roomName) {

      if (
        socket &&
        socket.readyState === WebSocket.OPEN
      ) {
        socket.close();
      }

      socket =
        new WebSocket(
          getWebSocketURL()
        );


      socket.addEventListener(
        "open",
        () => {

          showStatus(
            "Connected",
            "success"
          );

          socket.send(
            JSON.stringify({
              type: "join",
              room: roomName
            })
          );

        }
      );


      socket.addEventListener(
        "message",
        event => {

          let data;

          try {

            data =
              JSON.parse(
                event.data
              );

          } catch (error) {

            console.error(
              "Invalid server message:",
              error
            );

            return;
          }

          handleServerMessage(
            data
          );

        }
      );


      socket.addEventListener(
        "close",
        () => {

          showStatus(
            "Disconnected from server",
            "error"
          );

        }
      );


      socket.addEventListener(
        "error",
        error => {

          console.error(
            "WebSocket error:",
            error
          );

          showStatus(
            "Connection error",
            "error"
          );

        }
      );
    }


    // ========================================================
    // SEND
    // ========================================================

    function send(data) {

      if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
      ) {

        showStatus(
          "Not connected",
          "error"
        );

        return false;
      }

      socket.send(
        JSON.stringify(data)
      );

      return true;
    }


    // ========================================================
    // SERVER MESSAGE HANDLER
    // ========================================================

    function handleServerMessage(data) {

      // ======================================================
      // JOINED
      // ======================================================

      if (
        data.type ===
        "joined"
      ) {

        currentRoom =
          data.room;

        checkerColor =
          data.checkerColor;

        roomNameDisplay.textContent =
          currentRoom;

        updateCheckerRole();

        if (
          typeof data.userCount ===
          "number"
        ) {

          updateUserCount(
            data.userCount
          );

        }

        addSystemMessage(
          "You joined the room."
        );

        return;
      }


      // ======================================================
      // USER COUNT
      // ======================================================

      if (
        data.type ===
        "userCount"
      ) {

        updateUserCount(
          data.count
        );

        return;
      }


      // ======================================================
      // CHAT
      // ======================================================

      if (
        data.type ===
        "chat"
      ) {

        addChatMessage(
          data.message
        );

        return;
      }


      // ======================================================
      // SYSTEM
      // ======================================================

      if (
        data.type ===
        "system"
      ) {

        addSystemMessage(
          data.message
        );

        return;
      }


      // ======================================================
      // ERROR
      // ======================================================

      if (
        data.type ===
        "error"
      ) {

        addSystemMessage(
          "Error: " +
          data.message
        );

        showStatus(
          data.message,
          "error"
        );

        return;
      }


      // ======================================================
      // ROOM FULL
      // ======================================================

      if (
        data.type ===
        "roomFull"
      ) {

        homeError.textContent =
          data.message ||
          "This room is full.";

        if (socket) {
          socket.close();
        }

        return;
      }


      // ======================================================
      // DRAWING
      // ======================================================

      if (
        data.type ===
        "drawing"
      ) {

        drawRemoteLine(
          data.x1,
          data.y1,
          data.x2,
          data.y2,
          data.color
        );

        return;
      }


      // ======================================================
      // DRAWING CLEAR
      // ======================================================

      if (
        data.type ===
        "drawingClear"
      ) {

        clearCanvas();

        return;
      }


      // ======================================================
      // CHECKERS STATE
      // ======================================================

      if (
        data.type ===
        "checkersState"
      ) {

        if (data.state) {

          checkersState =
            data.state;

          selectedChecker =
            null;

          renderCheckersBoard();

          updateCheckersStatus();

        }

        return;
      }


      // ======================================================
      // CHECKERS MOVE
      // ======================================================

      if (
        data.type ===
        "checkersMove"
      ) {

        applyRemoteCheckersMove(
          data
        );

        return;
      }
    }


    // ========================================================
    // USER COUNT
    // ========================================================

    function updateUserCount(count) {

      userCount.textContent =
        count +
        " / 5 users";
    }


    // ========================================================
    // CHECKER ROLE
    // ========================================================

    function updateCheckerRole() {

      if (
        checkerColor ===
        "red"
      ) {

        checkerRole.textContent =
          "You: Red";

        checkerRole.style.background =
          "#c62828";

      } else if (
        checkerColor ===
        "black"
      ) {

        checkerRole.textContent =
          "You: Black";

        checkerRole.style.background =
          "#111";

      } else {

        checkerRole.textContent =
          "Spectator";

        checkerRole.style.background =
          "#444";
      }
    }


    // ========================================================
    // CHAT
    // ========================================================

    function addChatMessage(message) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "message";

      div.textContent =
        message;

      messages.appendChild(
        div
      );

      scrollMessagesToBottom();
    }


    function addSystemMessage(message) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "message systemMessage";

      div.textContent =
        message;

      messages.appendChild(
        div
      );

      scrollMessagesToBottom();
    }


    function scrollMessagesToBottom() {

      messages.scrollTop =
        messages.scrollHeight;
    }


    function sendChatMessage() {

      const message =
        chatInput.value.trim();

      if (!message) {
        return;
      }

      if (
        send({
          type: "chat",
          message
        })
      ) {

        chatInput.value =
          "";

        chatInput.focus();
      }
    }


    sendButton.addEventListener(
      "click",
      sendChatMessage
    );


    chatInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          sendChatMessage();
        }
      }
    );


    // ========================================================
    // TABS
    // ========================================================

    const tabButtons =
      document.querySelectorAll(
        ".tabButton"
      );

    const tabContents =
      document.querySelectorAll(
        ".tabContent"
      );


    tabButtons.forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const target =
            button.dataset.tab;


          tabButtons.forEach(
            otherButton => {

              otherButton.classList.remove(
                "active"
              );

            }
          );


          tabContents.forEach(
            content => {

              content.classList.remove(
                "active"
              );

            }
          );


          button.classList.add(
            "active"
          );


          document
            .getElementById(target)
            .classList.add(
              "active"
            );

        }
      );

    });


    // ========================================================
    // DRAWING
    // ========================================================

    function getCanvasCoordinates(event) {

      const rect =
        canvas.getBoundingClientRect();

      const scaleX =
        canvas.width /
        rect.width;

      const scaleY =
        canvas.height /
        rect.height;

      return {
        x:
          (event.clientX -
            rect.left) *
          scaleX,

        y:
          (event.clientY -
            rect.top) *
          scaleY
      };
    }


    function drawLine(
      x1,
      y1,
      x2,
      y2,
      color
    ) {

      ctx.beginPath();

      ctx.moveTo(
        x1,
        y1
      );

      ctx.lineTo(
        x2,
        y2
      );

      ctx.strokeStyle =
        color;

      ctx.lineWidth =
        4;

      ctx.lineCap =
        "round";

      ctx.lineJoin =
        "round";

      ctx.stroke();
    }


    function drawRemoteLine(
      x1,
      y1,
      x2,
      y2,
      color
    ) {

      drawLine(
        x1,
        y1,
        x2,
        y2,
        color || "#000000"
      );
    }


    function clearCanvas() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.fillStyle =
        "#ffffff";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );
    }


    function startDrawing(event) {

      event.preventDefault();

      const point =
        getCanvasCoordinates(
          event
        );

      drawing =
        true;

      lastX =
        point.x;

      lastY =
        point.y;
    }


    function continueDrawing(event) {

      if (!drawing) {
        return;
      }

      event.preventDefault();

      const point =
        getCanvasCoordinates(
          event
        );


      drawLine(
        lastX,
        lastY,
        point.x,
        point.y,
        currentColor
      );


      send({
        type: "drawing",

        x1: lastX,
        y1: lastY,

        x2: point.x,
        y2: point.y,

        color: currentColor
      });


      lastX =
        point.x;

      lastY =
        point.y;
    }


    function stopDrawing(event) {

      if (event) {
        event.preventDefault();
      }

      drawing =
        false;
    }


    canvas.addEventListener(
      "pointerdown",
      startDrawing
    );

    canvas.addEventListener(
      "pointermove",
      continueDrawing
    );

    canvas.addEventListener(
      "pointerup",
      stopDrawing
    );

    canvas.addEventListener(
      "pointercancel",
      stopDrawing
    );

    canvas.addEventListener(
      "pointerleave",
      stopDrawing
    );


    // ========================================================
    // DRAWING COLORS
    // ========================================================

    const colorButtons =
      document.querySelectorAll(
        ".colorButton"
      );


    colorButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            currentColor =
              button.dataset.color;


            colorButtons.forEach(
              otherButton => {

                otherButton.classList.remove(
                  "selected"
                );

              }
            );


            button.classList.add(
              "selected"
            );

          }
        );

      }
    );


    // ========================================================
    // CLEAR DRAWING
    // ========================================================

    document
      .getElementById(
        "clearDrawingButton"
      )
      .addEventListener(
        "click",
        () => {

          clearCanvas();

          send({
            type: "drawingClear"
          });

        }
      );


    // ========================================================
    // CHECKERS
    // ========================================================

    function renderCheckersBoard() {

      checkersBoard.innerHTML =
        "";

      if (
        !checkersState.board ||
        checkersState.board.length !== 8
      ) {
        return;
      }


      for (
        let row = 0;
        row < 8;
        row++
      ) {

        for (
          let col = 0;
          col < 8;
          col++
        ) {

          const square =
            document.createElement(
              "div"
            );


          square.className =
            "checkerSquare " +
            (
              (row + col) % 2 === 0
                ? "lightSquare"
                : "darkSquare"
            );


          square.dataset.row =
            row;

          square.dataset.col =
            col;


          const piece =
            checkersState.board[row][col];


          if (piece) {

            const pieceElement =
              document.createElement(
                "div"
              );


            pieceElement.className =
              "checkerPiece";


            if (
              getPieceColor(
                piece
              ) === "red"
            ) {

              pieceElement.classList.add(
                "redPiece"
              );

            } else {

              pieceElement.classList.add(
                "blackPiece"
              );

            }


            if (
              isKing(
                piece
              )
            ) {

              pieceElement.classList.add(
                "kingPiece"
              );

            }


            if (
              selectedChecker &&
              selectedChecker.row === row &&
              selectedChecker.col === col
            ) {

              pieceElement.classList.add(
                "selectedChecker"
              );

            }


            pieceElement.addEventListener(
              "click",
              event => {

                event.stopPropagation();

                selectCheckerPiece(
                  row,
                  col
                );

              }
            );


            square.appendChild(
              pieceElement
            );

          }


          /*
            Highlight selected piece's
            legal destinations.
          */

          if (
            selectedChecker &&
            isPossibleMove(
              selectedChecker.row,
              selectedChecker.col,
              row,
              col
            )
          ) {

            square.classList.add(
              "possibleMove"
            );


            if (
              Math.abs(
                row -
                selectedChecker.row
              ) === 2
            ) {

              square.classList.add(
                "captureMove"
              );

            }


            square.addEventListener(
              "click",
              () => {

                makeCheckersMove(
                  selectedChecker.row,
                  selectedChecker.col,
                  row,
                  col
                );

              }
            );

          }


          checkersBoard.appendChild(
            square
          );
        }
      }
    }


    function getPieceColor(piece) {

      if (
        piece === "red" ||
        piece === "redKing"
      ) {
        return "red";
      }

      if (
        piece === "black" ||
        piece === "blackKing"
      ) {
        return "black";
      }

      return null;
    }


    function isKing(piece) {

      return (
        piece === "redKing" ||
        piece === "blackKing"
      );
    }


    function isPossibleMove(
      fromRow,
      fromCol,
      toRow,
      toCol
    ) {

      if (
        !checkerColor ||
        checkersState.gameOver
      ) {
        return false;
      }


      if (
        checkersState.turn !==
        checkerColor
      ) {
        return false;
      }


      const board =
        checkersState.board;


      const piece =
        board[fromRow][fromCol];


      if (!piece) {
        return false;
      }


      if (
        getPieceColor(piece) !==
        checkerColor
      ) {
        return false;
      }


      if (
        board[toRow][toCol] !== null
      ) {
        return false;
      }


      if (
        (toRow + toCol) % 2 === 0
      ) {
        return false;
      }


      const rowDifference =
        toRow -
        fromRow;

      const colDifference =
        toCol -
        fromCol;


      const absRow =
        Math.abs(
          rowDifference
        );

      const absCol =
        Math.abs(
          colDifference
        );


      // Normal move

      if (
        absRow === 1 &&
        absCol === 1
      ) {

        if (
          isKing(piece)
        ) {
          return true;
        }


        if (
          checkerColor === "red"
        ) {

          return (
            rowDifference === -1
          );

        }


        if (
          checkerColor === "black"
        ) {

          return (
            rowDifference === 1
          );

        }
      }


      // Capture

      if (
        absRow === 2 &&
        absCol === 2
      ) {

        const middleRow =
          fromRow +
          rowDifference / 2;

        const middleCol =
          fromCol +
          colDifference / 2;


        const middlePiece =
          board[middleRow][middleCol];


        if (!middlePiece) {
          return false;
        }


        if (
          getPieceColor(
            middlePiece
          ) === checkerColor
        ) {
          return false;
        }


        if (
          isKing(piece)
        ) {
          return true;
        }


        if (
          checkerColor === "red"
        ) {

          return (
            rowDifference === -2
          );

        }


        if (
          checkerColor === "black"
        ) {

          return (
            rowDifference === 2
          );

        }
      }


      return false;
    }


    function selectCheckerPiece(
      row,
      col
    ) {

      if (
        !checkerColor
      ) {

        showStatus(
          "You are a spectator.",
          "error"
        );

        return;
      }


      if (
        checkersState.gameOver
      ) {
        return;
      }


      if (
        checkersState.turn !==
        checkerColor
      ) {

        showStatus(
          "It is not your turn.",
          "error"
        );

        return;
      }


      const piece =
        checkersState.board[row][col];


      if (!piece) {
        return;
      }


      if (
        getPieceColor(piece) !==
        checkerColor
      ) {

        showStatus(
          "That is not your piece.",
          "error"
        );

        return;
      }


      selectedChecker = {
        row,
        col
      };


      renderCheckersBoard();
    }


    function makeCheckersMove(
      fromRow,
      fromCol,
      toRow,
      toCol
    ) {

      if (
        !checkerColor
      ) {
        return;
      }


      if (
        checkersState.gameOver
      ) {
        return;
      }


      if (
        checkersState.turn !==
        checkerColor
      ) {
        return;
      }


      if (
        !isPossibleMove(
          fromRow,
          fromCol,
          toRow,
          toCol
        )
      ) {

        showStatus(
          "That is not a legal move.",
          "error"
        );

        return;
      }


      send({
        type: "checkersMove",

        move: {
          fromRow,
          fromCol,
          toRow,
          toCol
        }
      });


      selectedChecker =
        null;
    }


    function applyRemoteCheckersMove(
      data
    ) {

      const move =
        data.move;


      if (!move) {
        return;
      }


      const board =
        checkersState.board;


      /*
        Move piece.
      */

      board[move.fromRow][move.fromCol] =
        null;


      /*
        Remove captured piece.
      */

      if (
        move.captured
      ) {

        board[
          move.captured.row
        ][
          move.captured.col
        ] = null;

      }


      /*
        Place moved piece.
      */

      board[
        move.toRow
      ][
        move.toCol
      ] =
        move.piece;


      checkersState.turn =
        data.turn;

      checkersState.gameOver =
        data.gameOver;

      checkersState.winner =
        data.winner;


      selectedChecker =
        null;


      renderCheckersBoard();

      updateCheckersStatus();
    }


    function updateCheckersStatus() {

      if (
        checkersState.gameOver
      ) {

        if (
          checkersState.winner
        ) {

          if (
            checkerColor ===
            checkersState.winner
          ) {

            checkersStatus.textContent =
              "You won!";

          } else {

            checkersStatus.textContent =
              checkersState.winner
              .toUpperCase() +
              " wins!";

          }

        } else {

          checkersStatus.textContent =
            "Game over.";

        }

        return;
      }


      if (
        !checkerColor
      ) {

        checkersStatus.textContent =
          "You are watching the game.";

        return;
      }


      if (
        checkersState.turn ===
        checkerColor
      ) {

        checkersStatus.textContent =
          "Your turn (" +
          checkerColor +
          ")";

      } else {

        checkersStatus.textContent =
          checkersState.turn
          .toUpperCase() +
          "'s turn";

      }
    }


    // ========================================================
    // NEW GAME
    // ========================================================

    newGameButton.addEventListener(
      "click",
      () => {

        send({
          type: "checkersReset"
        });

      }
    );


    // ========================================================
    // JOIN ROOM
    // ========================================================

    function joinRoom() {

      const room =
        roomInput.value.trim();


      if (!room) {

        homeError.textContent =
          "Please enter a room name.";

        roomInput.focus();

        return;
      }


      homeError.textContent =
        "";


      /*
        Show app immediately while
        connection is being established.
      */

      homePage.style.display =
        "none";

      appPage.style.display =
        "flex";


      messages.innerHTML =
        "";

      clearCanvas();


      checkersState = {
        board: [],
        turn: "red",
        gameOver: false,
        winner: null
      };


      checkerColor =
        null;

      selectedChecker =
        null;


      renderCheckersBoard();

      updateCheckersStatus();

      updateCheckerRole();


      connectToServer(
        room
      );
    }


    joinButton.addEventListener(
      "click",
      joinRoom
    );


    roomInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          joinRoom();
        }

      }
    );


    // ========================================================
    // HOME BUTTON
    // ========================================================

    homeButton.addEventListener(
      "click",
      () => {

        if (socket) {

          try {
            socket.close();
          } catch (error) {
            console.error(error);
          }

        }


        socket =
          null;

        currentRoom =
          "";

        checkerColor =
          null;

        selectedChecker =
          null;


        appPage.style.display =
          "none";

        homePage.style.display =
          "flex";


        roomNameDisplay.textContent =
          "---";

        userCount.textContent =
          "0 / 5 users";

        checkerRole.textContent =
          "Spectator";

        checkerRole.style.background =
          "#444";


        messages.innerHTML =
          "";

        clearCanvas();


        checkersState = {
          board: [],
          turn: "red",
          gameOver: false,
          winner: null
        };


        renderCheckersBoard();

        updateCheckersStatus();


        roomInput.value =
          "";

        homeError.textContent =
          "";

        roomInput.focus();

      }
    );


    // ========================================================
    // INITIALIZE CANVAS
    // ========================================================

    clearCanvas();


    // ========================================================
    // INITIALIZE CHECKERS
    // ========================================================

    renderCheckersBoard();

    updateCheckersStatus();


    // ========================================================
    // INITIAL ROOM INPUT FOCUS
    // ========================================================

    roomInput.focus();

  </script>

</body>
</html>
